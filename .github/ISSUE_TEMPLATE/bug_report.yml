name: Bug report
description: Reproduce a failed workflow, unnecessary denial, or incorrect result
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use SECURITY.md for vulnerabilities, not a public issue. Remove credentials,
        private paths, prompts, and repository contents from examples and logs.
  - type: input
    id: surface
    attributes:
      label: Affected command or workflow
      placeholder: "Install, update, memory handoff, agent host, or function name"
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Version and environment
      description: MAINFRAME version/commit and install method, OS/architecture, calling shell, actual Bash runtime path/version, agent/version if used
      placeholder: "Include whether this is a source checkout or installed artifact. zsh caller and Bash engine are separate."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands and non-sensitive fixture needed to reproduce; note any task sandbox or other environment restrictions
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What useful operation should complete, or what documented rule should deny it?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the exit code and sanitized output. Is this discovery, direct CLI use, a live agent call, or a host hook?
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Impact and recovery
      description: Did this interrupt a task, repeat setup, falsely block useful work, or require recovery? What workaround helped?
