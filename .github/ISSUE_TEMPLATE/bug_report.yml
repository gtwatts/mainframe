name: Bug Report
description: Report a bug in Mainframe for Pi
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Report the smallest reproducible Mainframe for Pi issue. Redact credentials, personal paths, checkpoint contents, and private project data. Other coding-agent adapters are frozen compatibility material.

  - type: input
    id: function
    attributes:
      label: Affected Pi workflow or tool
      description: Which Mainframe command, tool, or installation step is affected?
      placeholder: "e.g., mainframe_awm checkpoint, protected Bash cancellation, /mainframe doctor"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is
      placeholder: "Describe what happened..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Start Pi in a disposable project with Mainframe loaded.
        2. Run the affected command or tool with minimal non-private input.
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: bash-version
    attributes:
      label: Bash Version
      description: Output of `bash --version`
      placeholder: "e.g., GNU bash, version 5.1.16"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - WSL/Windows
        - FreeBSD
        - Other
    validations:
      required: true

  - type: input
    id: runtime-versions
    attributes:
      label: Mainframe and Pi versions
      description: Include Mainframe version/revision, Pi package name/version, Node version, and whether this is a custom Pi build.
      placeholder: "Mainframe 10.3.1, Pi package/version, Node version"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem
