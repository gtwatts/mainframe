            --source-date-epoch "$(git show -s --format=%ct "$EXPECTED_TAG_COMMIT")" \
            --archive "$archive" \
            --manifest "$manifest" \
            --bundle "$bundle")"
          test "$(jq -er '.status' <<<"$verify_result")" = "valid"
          test "$(jq -er '.manifest_sha256' <<<"$verify_result")" = \
            "$(sha256sum "$manifest" | awk '{print $1}')"
          test "$(jq -er '.bundle_sha256' <<<"$verify_result")" = \
            "$(sha256sum "$bundle" | awk '{print $1}')"
          pi_evidence_run_id="$(jq -er '.source.workflow_run_id' "$pi_evidence")"
          pi_evidence_run_attempt="$(jq -er '.source.workflow_run_attempt' "$pi_evidence")"
          test "$pi_evidence_run_id" = "$evidence_run_id"
          test "$pi_evidence_run_attempt" = "$evidence_run_attempt"
          python3 scripts/dev/native-host/validate-evidence.py \
            .github/schemas/pi-release-evidence.schema.json \
            "$pi_evidence"
          python3 .github/scripts/build-pi-release-evidence.py verify \
            --contract .github/pi-evidence-contract.json \
            --schema .github/schemas/pi-release-evidence.schema.json \
            --cell-schema .github/schemas/pi-cell-evidence.schema.json \
            --repo-root "$GITHUB_WORKSPACE" \
            --archive "$archive" \
            --repository "$GH_REPO" \
            --version "$RELEASE_VERSION" \
            --tag "$tag" \
            --tag-ref-sha "$EXPECTED_TAG_REF_SHA" \
            --tag-commit-sha "$EXPECTED_TAG_COMMIT" \
            --workflow-run-id "$pi_evidence_run_id" \
            --workflow-run-attempt "$pi_evidence_run_attempt" \
            --cell-receipts-dir "$asset_root" \
            --evidence "$pi_evidence"

          expected_pi_invocation="https://github.com/${GH_REPO}/actions/runs/${pi_evidence_run_id}/attempts/${pi_evidence_run_attempt}"
          mapfile -t released_pi_cell_names < <(
            jq -er '.matrix[].artifacts.cell_receipt.name' "$pi_evidence" |
              LC_ALL=C sort
          )
          test "${#released_pi_cell_names[@]}" -eq 6
          for cell_name in "${released_pi_cell_names[@]}"; do
            cell_receipt="$asset_root/$cell_name"
            cell_sha="$(sha256sum "$cell_receipt" | awk '{print $1}')"
            verification="$(gh attestation verify "$cell_receipt" \
              --repo "$GH_REPO" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --signer-workflow "$GH_REPO/.github/workflows/test.yml" \
              --signer-digest "$EXPECTED_TAG_COMMIT" \
              --source-digest "$EXPECTED_TAG_COMMIT" \
              --source-ref "$tag_ref" \
              --deny-self-hosted-runners \
              --limit 100 \
              --format json)"
            jq -e \
              --arg name "$cell_name" \
              --arg sha "$cell_sha" \
              --arg invocation "$expected_pi_invocation" '
                any(.[];
                  .verificationResult.statement.predicateType ==
                    "https://slsa.dev/provenance/v1" and
                  .verificationResult.statement.subject == [
                    {name: $name, digest: {sha256: $sha}}
                  ] and
                  .verificationResult.statement.predicate.runDetails.metadata.invocationId ==
                    $invocation and
                  .verificationResult.signature.certificate.runInvocationURI ==
                    $invocation and
                  .verificationResult.signature.certificate.runnerEnvironment ==
                    "github-hosted")
              ' <<<"$verification" >/dev/null
          done

          gh release verify "$tag"
          for asset in \
            "$archive" \
            "$checksum" \
            "$sbom" \
            "$manifest" \
            "$bundle" \
            "$pi_evidence" \
            "$mcp_wheel" \
            "$mcp_sdist" \
            "$mcp_pair_manifest" \
            "$asset_root/pi-cell-fork-0.84.2-Darwin-arm64-none.json" \
            "$asset_root/pi-cell-fork-0.84.2-Darwin-x86_64-none.json" \
            "$asset_root/pi-cell-fork-0.84.2-Linux-x86_64-glibc.json" \
            "$asset_root/pi-cell-upstream-0.73.1-Darwin-arm64-none.json" \
            "$asset_root/pi-cell-upstream-0.73.1-Darwin-x86_64-none.json" \
            "$asset_root/pi-cell-upstream-0.73.1-Linux-x86_64-glibc.json" \
            "$formula"; do
            gh release verify-asset "$tag" "$asset"
          done
          gh attestation verify "$formula" \
            --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/test.yml" \
            --signer-digest "$EXPECTED_TAG_COMMIT" \
            --source-digest "$EXPECTED_TAG_COMMIT" \
            --source-ref "$tag_ref" \
            --deny-self-hosted-runners

          mcp_invocation_prefix="https://github.com/${GH_REPO}/actions/runs/${evidence_run_id}/attempts/"
          for subject in "$mcp_wheel" "$mcp_sdist" "$mcp_pair_manifest"; do
            subject_name="${subject##*/}"
            subject_sha="$(sha256sum "$subject" | awk '{print $1}')"
            verification="$(gh attestation verify "$subject" \
              --repo "$GH_REPO" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --signer-workflow "$GH_REPO/.github/workflows/test.yml" \
              --signer-digest "$EXPECTED_TAG_COMMIT" \
              --source-digest "$EXPECTED_TAG_COMMIT" \
              --source-ref "$tag_ref" \
              --deny-self-hosted-runners \
              --limit 100 \
              --format json)"
            jq -e \
              --arg name "$subject_name" \
              --arg sha "$subject_sha" \
              --arg prefix "$mcp_invocation_prefix" \
              --argjson max_attempt "$evidence_run_attempt" '
                any(.[];
                  (.verificationResult.statement.predicateType ==
                    "https://slsa.dev/provenance/v1" and
                   .verificationResult.statement.subject == [
                     {name: $name, digest: {sha256: $sha}}
                   ] and
                   .verificationResult.signature.certificate.runnerEnvironment ==
                     "github-hosted") and
                  ((.verificationResult.statement.predicate.runDetails.metadata.invocationId) as
                    $invocation |
                    $invocation ==
                      .verificationResult.signature.certificate.runInvocationURI and
                    ($invocation | startswith($prefix)) and
                    (($invocation | ltrimstr($prefix)) |
                      test("^[1-9][0-9]*$")) and
                    (($invocation | ltrimstr($prefix) | tonumber) <= $max_attempt))
                )
              ' <<<"$verification" >/dev/null
          done

          predicate_type="https://github.com/gtwatts/mainframe/attestations/release-evidence/v1"
          expected_release_invocation="https://github.com/${GH_REPO}/actions/runs/${evidence_run_id}/attempts/${evidence_run_attempt}"
          expected_subjects="$(jq -cn \
            --arg archive_name "${archive##*/}" \
            --arg archive_sha "$archive_sha" \
            --arg manifest_name "${manifest##*/}" \
            --arg manifest_sha "$(sha256sum "$manifest" | awk '{print $1}')" \
            --arg bundle_name "${bundle##*/}" \
            --arg bundle_sha "$(sha256sum "$bundle" | awk '{print $1}')" \
            --arg pi_evidence_name "${pi_evidence##*/}" \
            --arg pi_evidence_sha "$(sha256sum "$pi_evidence" | awk '{print $1}')" '
              [
                {name: $archive_name, digest: {sha256: $archive_sha}},
                {name: $manifest_name, digest: {sha256: $manifest_sha}},
                {name: $bundle_name, digest: {sha256: $bundle_sha}},
                {name: $pi_evidence_name, digest: {sha256: $pi_evidence_sha}}
              ] | sort_by(.name)
            ')"
          for subject in \
            "$archive" \
            "$manifest" \
            "$bundle" \
            "$pi_evidence"; do
            verification="$(gh attestation verify "$subject" \
              --repo "$GH_REPO" \
              --predicate-type "$predicate_type" \
              --signer-workflow "$GH_REPO/.github/workflows/test.yml" \
              --signer-digest "$EXPECTED_TAG_COMMIT" \
              --source-digest "$EXPECTED_TAG_COMMIT" \
              --source-ref "$tag_ref" \
              --deny-self-hosted-runners \
              --limit 100 \
              --format json)"
            jq -e \
              --arg predicate_type "$predicate_type" \
              --arg expected_invocation "$expected_release_invocation" \
              --arg expected_run_id "$evidence_run_id" \
              --argjson expected_run_attempt "$evidence_run_attempt" \
              --argjson expected_subjects "$expected_subjects" \
              --slurpfile manifest "$manifest" '
              any(.[];
                .verificationResult.statement.predicateType == $predicate_type and
                .verificationResult.statement.predicate == $manifest[0] and
                .verificationResult.statement.predicate.release.workflow.run_id ==
                  $expected_run_id and
                .verificationResult.statement.predicate.release.workflow.run_attempt ==
                  $expected_run_attempt and
                (.verificationResult.statement.subject | sort_by(.name)) ==
                  $expected_subjects and
                .verificationResult.signature.certificate.runInvocationURI ==
                  $expected_invocation and
                .verificationResult.signature.certificate.runnerEnvironment ==
                  "github-hosted")
            ' <<<"$verification" >/dev/null
          done
