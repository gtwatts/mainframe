          RELEASE_VERSION: ${{ needs.release-build.outputs.version }}
          EXPECTED_TAG_REF_SHA: ${{ needs.release-build.outputs.tag_ref_sha }}
          EXPECTED_TAG_COMMIT: ${{ needs.release-build.outputs.tag_commit }}
          EXPECTED_ARCHIVE_SHA: ${{ needs.release-build.outputs.release_archive_sha256 }}
          EXPECTED_CHECKSUM_SHA: ${{ needs.release-build.outputs.release_checksum_sha256 }}
          EXPECTED_SBOM_SHA: ${{ needs.release-build.outputs.release_sbom_sha256 }}
          EXPECTED_FORMULA_SHA: ${{ needs.release-build.outputs.release_formula_sha256 }}
          EXPECTED_MANIFEST_SHA: ${{ needs.release-build.outputs.release_evidence_manifest_sha256 }}
          EXPECTED_BUNDLE_SHA: ${{ needs.release-build.outputs.release_evidence_bundle_sha256 }}
          EXPECTED_PI_EVIDENCE_SHA: ${{ needs.release-build.outputs.release_pi_evidence_sha256 }}
          EXPECTED_MCP_WHEEL_SHA: ${{ needs.release-build.outputs.release_mcp_wheel_sha256 }}
          EXPECTED_MCP_SDIST_SHA: ${{ needs.release-build.outputs.release_mcp_sdist_sha256 }}
          EXPECTED_MCP_MANIFEST_SHA: ${{ needs.release-build.outputs.release_mcp_manifest_sha256 }}
        run: |
          set -euo pipefail
          archive="dist/mainframe-${RELEASE_VERSION}.tar.gz"
          checksum="${archive}.sha256"
          sbom="dist/mainframe-${RELEASE_VERSION}.sbom.json"
          formula="dist/mainframe.rb"
          manifest="dist/mainframe-${RELEASE_VERSION}.release-evidence.json"
          bundle="dist/mainframe-${RELEASE_VERSION}.release-evidence.tar.gz"
          pi_evidence="dist/mainframe-${RELEASE_VERSION}.pi-evidence.json"
          mcp_wheel="dist/mainframe_mcp-${RELEASE_VERSION}-py3-none-any.whl"
          mcp_sdist="dist/mainframe_mcp-${RELEASE_VERSION}.tar.gz"
          mcp_pair_manifest="dist/mainframe-mcp-candidate.sha256"
          (cd dist && sha256sum -c "mainframe-${RELEASE_VERSION}.tar.gz.sha256")
          test -s "dist/mainframe-${RELEASE_VERSION}.sbom.json"
          test -s "$manifest"
          test -s "$bundle"
          test -s "$pi_evidence"
          test ! -L "$pi_evidence"
          test -s "$mcp_wheel"
          test ! -L "$mcp_wheel"
          test -s "$mcp_sdist"
          test ! -L "$mcp_sdist"
          test -s "$mcp_pair_manifest"
          test ! -L "$mcp_pair_manifest"
          test -s dist/mainframe.rb
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA"
          test "$(sha256sum "${archive}.sha256" | awk '{print $1}')" = \
            "$EXPECTED_CHECKSUM_SHA"
          test "$(sha256sum "dist/mainframe-${RELEASE_VERSION}.sbom.json" | awk '{print $1}')" = \
            "$EXPECTED_SBOM_SHA"
          test "$(sha256sum dist/mainframe.rb | awk '{print $1}')" = "$EXPECTED_FORMULA_SHA"
          test "$(sha256sum "$manifest" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA"
          test "$(sha256sum "$bundle" | awk '{print $1}')" = "$EXPECTED_BUNDLE_SHA"
          test "$(sha256sum "$pi_evidence" | awk '{print $1}')" = \
            "$EXPECTED_PI_EVIDENCE_SHA"
          test "$(sha256sum "$mcp_wheel" | awk '{print $1}')" = \
            "$EXPECTED_MCP_WHEEL_SHA"
          test "$(sha256sum "$mcp_sdist" | awk '{print $1}')" = \
            "$EXPECTED_MCP_SDIST_SHA"
          test "$(sha256sum "$mcp_pair_manifest" | awk '{print $1}')" = \
            "$EXPECTED_MCP_MANIFEST_SHA"
          python3 - "dist" "$RELEASE_VERSION" <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import re
          import sys
          import tarfile
          import zipfile

          root = Path(sys.argv[1])
          version = sys.argv[2]
          wheel_name = f"mainframe_mcp-{version}-py3-none-any.whl"
          sdist_name = f"mainframe_mcp-{version}.tar.gz"
          runtime_name = f"mainframe-{version}.tar.gz"
          expected_names = [wheel_name, sdist_name, runtime_name]

          def digest(path: Path) -> str:
              result = sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      result.update(chunk)
              return result.hexdigest()

          manifest = root / "mainframe-mcp-candidate.sha256"
          text = manifest.read_bytes().decode("ascii")
          if not text.endswith("\n"):
              raise SystemExit("MCP runtime-pair manifest must end with a newline")
          records = text.splitlines()
          if len(records) != 3:
              raise SystemExit("MCP runtime-pair manifest record count is not exact")
          for record, expected_name in zip(records, expected_names, strict=True):
              match = re.fullmatch(r"([0-9a-f]{64})  ([A-Za-z0-9_.-]+)", record)
              if match is None or match.group(2) != expected_name:
                  raise SystemExit("MCP runtime-pair manifest order or syntax is invalid")
              if match.group(1) != digest(root / expected_name):
                  raise SystemExit(f"MCP runtime-pair digest mismatch: {expected_name}")

          runtime = root / runtime_name
          with tarfile.open(runtime, "r:gz") as archive:
              members = [member for member in archive.getmembers()
                         if member.name == "SHA256SUMS"]
              assert len(members) == 1 and members[0].isfile()
              source = archive.extractfile(members[0])
              assert source is not None
              inventory_digest = sha256(source.read()).hexdigest()
          with zipfile.ZipFile(root / wheel_name) as package:
              wheel_binding = package.read(
                  "mainframe_mcp/_runtime_release.py"
              ).decode("utf-8")
          with tarfile.open(root / sdist_name, "r:gz") as package:
              source = package.extractfile(
                  f"mainframe_mcp-{version}/src/mainframe_mcp/_runtime_release.py"
              )
              assert source is not None
              sdist_binding = source.read().decode("utf-8")
          pattern = r"EXPECTED_RUNTIME_INVENTORY_SHA256 = '([0-9a-f]{64})'"
          for label, content in (("wheel", wheel_binding), ("sdist", sdist_binding)):
              if re.findall(pattern, content) != [inventory_digest]:
                  raise SystemExit(f"{label} runtime binding mismatch")
          PY
          evidence_run_id="$(jq -er '.release.workflow.run_id' "$manifest")"
          evidence_run_attempt="$(jq -er '.release.workflow.run_attempt' "$manifest")"
          test "$evidence_run_id" = "$GITHUB_RUN_ID"
          test "$evidence_run_attempt" -ge 1
          test "$evidence_run_attempt" -le "$GITHUB_RUN_ATTEMPT"
          archive_sha="$(sha256sum "$archive" | awk '{print $1}')"
          grep -Fxq "  sha256 \"$archive_sha\"" dist/mainframe.rb
          grep -Fq \
            "releases/download/v${RELEASE_VERSION}/mainframe-${RELEASE_VERSION}.tar.gz" \
            dist/mainframe.rb
          ruby -c dist/mainframe.rb
          umask 077
          candidate_root="$(mktemp -d \
            "$RUNNER_TEMP/mainframe-prepublish-candidate.XXXXXX")"
          cleanup_candidate() {
            rm -rf -- "$candidate_root"
          }
          trap cleanup_candidate EXIT
          candidate_manifest="$candidate_root/mainframe-${RELEASE_VERSION}.candidate.json"
          python3 scripts/dev/verify-release-candidate.py \
            --version "$RELEASE_VERSION" \
            --archive "$archive" \
            --checksum "$checksum" \
            --sbom "$sbom" \
            --formula "$formula" \
            --manifest "$candidate_manifest"
          test -s "$candidate_manifest"

          verify_result="$(python3 scripts/dev/native-host/build-release-evidence.py verify \
            --repo-root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION" \
            --tag "v$RELEASE_VERSION" \
            --tag-ref "refs/tags/v$RELEASE_VERSION" \
            --tag-ref-sha "$EXPECTED_TAG_REF_SHA" \
            --tag-commit-sha "$EXPECTED_TAG_COMMIT" \
            --workflow-run-id "$evidence_run_id" \
            --workflow-run-attempt "$evidence_run_attempt" \
            --source-date-epoch "$(git show -s --format=%ct "$EXPECTED_TAG_COMMIT")" \
            --archive "$archive" \
            --manifest "$manifest" \
            --bundle "$bundle")"
          test "$(jq -er '.manifest_sha256' <<<"$verify_result")" = "$EXPECTED_MANIFEST_SHA"
          test "$(jq -er '.bundle_sha256' <<<"$verify_result")" = "$EXPECTED_BUNDLE_SHA"
          pi_evidence_run_id="$(jq -er '.source.workflow_run_id' "$pi_evidence")"
          pi_evidence_run_attempt="$(jq -er '.source.workflow_run_attempt' "$pi_evidence")"
          test "$pi_evidence_run_id" = "$evidence_run_id"
          test "$pi_evidence_run_attempt" = "$evidence_run_attempt"
          python3 scripts/dev/native-host/validate-evidence.py \
            .github/schemas/pi-release-evidence.schema.json \
            "$pi_evidence"
          python3 .github/scripts/build-pi-release-evidence.py verify \
            --contract .github/pi-evidence-contract.json \
            --schema .github/schemas/pi-release-evidence.schema.json \
            --cell-schema .github/schemas/pi-cell-evidence.schema.json \
            --repo-root "$GITHUB_WORKSPACE" \
            --archive "$archive" \
            --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION" \
            --tag "v$RELEASE_VERSION" \
            --tag-ref-sha "$EXPECTED_TAG_REF_SHA" \
            --tag-commit-sha "$EXPECTED_TAG_COMMIT" \
            --workflow-run-id "$pi_evidence_run_id" \
            --workflow-run-attempt "$pi_evidence_run_attempt" \
            --cell-receipts-dir dist \
            --evidence "$pi_evidence"

      - name: Create complete draft, then publish or verify existing release
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.release-build.outputs.version }}
          EXPECTED_TAG_REF_SHA: ${{ needs.release-build.outputs.tag_ref_sha }}
          EXPECTED_TAG_COMMIT: ${{ needs.release-build.outputs.tag_commit }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          tag_ref="refs/tags/$tag"
          verify_tag_identity() {
            local remote_ref_sha remote_commit
            remote_ref_sha="$(git ls-remote --refs origin "$tag_ref" | awk 'NF == 2 {print $1}')"
            [[ "$remote_ref_sha" == "$EXPECTED_TAG_REF_SHA" ]] || {
              echo "ERROR: remote release tag ref changed" >&2
              return 1
            }
            git fetch --force --no-tags origin \
              "$tag_ref:refs/mainframe-publish/release-tag" >/dev/null
            remote_commit="$(git rev-parse 'refs/mainframe-publish/release-tag^{commit}')"
            [[ "$remote_commit" == "$EXPECTED_TAG_COMMIT" ]] || {
              echo "ERROR: remote release tag commit changed" >&2
              return 1
            }
            git merge-base --is-ancestor \
              "$EXPECTED_TAG_COMMIT" refs/remotes/origin/main
          }
          verify_tag_identity
          if release_json="$(gh release view "$tag" \
            --json tagName,isDraft,isPrerelease 2>/dev/null)"; then
            jq -e --arg tag "$tag" '
              .tagName == $tag and
              .isDraft == false and
              .isPrerelease == false
            ' <<<"$release_json" >/dev/null || {
              echo "ERROR: existing release $tag is not a published stable release" >&2
              exit 1
            }
            echo "Release $tag already exists; entering immutable verification-only mode"
            printf 'created=false\n' >> "$GITHUB_OUTPUT"
          else
            gh release create "$tag" \
              --verify-tag \
              --draft \
              --title "Release $tag" \
              --generate-notes \
              "dist/mainframe-${RELEASE_VERSION}.tar.gz" \
              "dist/mainframe-${RELEASE_VERSION}.tar.gz.sha256" \
              "dist/mainframe-${RELEASE_VERSION}.sbom.json" \
              "dist/mainframe-${RELEASE_VERSION}.release-evidence.json" \
              "dist/mainframe-${RELEASE_VERSION}.release-evidence.tar.gz" \
              "dist/mainframe-${RELEASE_VERSION}.pi-evidence.json" \
              "dist/mainframe_mcp-${RELEASE_VERSION}-py3-none-any.whl" \
              "dist/mainframe_mcp-${RELEASE_VERSION}.tar.gz" \
              "dist/mainframe-mcp-candidate.sha256" \
              "dist/pi-cell-fork-0.84.2-Darwin-arm64-none.json" \
              "dist/pi-cell-fork-0.84.2-Darwin-x86_64-none.json" \
              "dist/pi-cell-fork-0.84.2-Linux-x86_64-glibc.json" \
              "dist/pi-cell-upstream-0.73.1-Darwin-arm64-none.json" \
              "dist/pi-cell-upstream-0.73.1-Darwin-x86_64-none.json" \
              "dist/pi-cell-upstream-0.73.1-Linux-x86_64-glibc.json" \
              "dist/mainframe.rb"
            # A mismatch leaves a reversible draft instead of publishing assets
            # for a tag identity that changed during release creation.
            verify_tag_identity
            draft_asset_names=(
              "mainframe-${RELEASE_VERSION}.tar.gz"
              "mainframe-${RELEASE_VERSION}.tar.gz.sha256"
              "mainframe-${RELEASE_VERSION}.sbom.json"
              "mainframe-${RELEASE_VERSION}.release-evidence.json"
              "mainframe-${RELEASE_VERSION}.release-evidence.tar.gz"
              "mainframe-${RELEASE_VERSION}.pi-evidence.json"
              "mainframe_mcp-${RELEASE_VERSION}-py3-none-any.whl"
              "mainframe_mcp-${RELEASE_VERSION}.tar.gz"
              "mainframe-mcp-candidate.sha256"
              "pi-cell-fork-0.84.2-Darwin-arm64-none.json"
              "pi-cell-fork-0.84.2-Darwin-x86_64-none.json"
              "pi-cell-fork-0.84.2-Linux-x86_64-glibc.json"
              "pi-cell-upstream-0.73.1-Darwin-arm64-none.json"
              "pi-cell-upstream-0.73.1-Darwin-x86_64-none.json"
              "pi-cell-upstream-0.73.1-Linux-x86_64-glibc.json"
              mainframe.rb
            )
            test "${#draft_asset_names[@]}" -eq 16
            mapfile -t draft_releases < <(
              gh api --paginate \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/$GH_REPO/releases?per_page=100" |
                jq -cer --arg tag "$tag" \
                  '.[] | select(.tag_name == $tag and .draft == true)'
            )
            test "${#draft_releases[@]}" -eq 1
            draft_metadata="${draft_releases[0]}"
            jq -e --arg tag "$tag" '
              .tag_name == $tag and .draft == true and .prerelease == false
            ' <<<"$draft_metadata" >/dev/null
            expected_draft_assets="$(
              for asset_name in "${draft_asset_names[@]}"; do
                asset="dist/$asset_name"
                test -f "$asset"
                test ! -L "$asset"
                jq -cn \
                  --arg name "$asset_name" \
                  --arg sha "$(sha256sum "$asset" | awk '{print $1}')" \
                  '{name: $name, digest: ("sha256:" + $sha)}'
              done | jq -sc 'sort_by(.name)'
            )"
            actual_draft_assets="$(jq -c \
              '[.assets[] | {name, digest}] | sort_by(.name)' \
              <<<"$draft_metadata")"
            if [[ "$actual_draft_assets" != "$expected_draft_assets" ]]; then
              echo "ERROR: draft release asset names or digests are not exact" >&2
              exit 1
            fi
            umask 077
            draft_root="$(mktemp -d \
              "$RUNNER_TEMP/mainframe-draft-release.XXXXXX")"
            cleanup_draft_assets() {
              rm -rf -- "$draft_root"
            }
            trap cleanup_draft_assets EXIT
            for asset_name in "${draft_asset_names[@]}"; do
              remote_asset="$draft_root/$asset_name"
              asset_id="$(jq -er --arg name "$asset_name" '
                [.assets[] | select(.name == $name)] |
                if length == 1 then .[0].id else error("asset id is not unique") end
              ' <<<"$draft_metadata")"
              gh api \
                -H "Accept: application/octet-stream" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/$GH_REPO/releases/assets/$asset_id" > "$remote_asset"
              test -f "$remote_asset"
              test ! -L "$remote_asset"
              cmp -- "dist/$asset_name" "$remote_asset"
            done
            mapfile -t downloaded_draft_assets < <(
              find "$draft_root" -mindepth 1 -maxdepth 1 -type f -print |
                LC_ALL=C sort
            )
            test "${#downloaded_draft_assets[@]}" -eq 16
            test -z "$(find "$draft_root" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
            verify_tag_identity
            gh release edit "$tag" --draft=false
            printf 'created=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify immutable release and archive attestation
        env:
