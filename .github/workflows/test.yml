          test -x "$node_bin"
          staged_node_root="${RUNNER_TEMP}/mainframe-native-node"
          staged_node_dir="$staged_node_root/bin"
          [[ ! -e "$staged_node_root" && ! -L "$staged_node_root" ]]
          mkdir -m 0700 "$staged_node_root"
          mkdir -m 0700 "$staged_node_dir"
          staged_node_dir="$(cd "$staged_node_dir" && pwd -P)"
          /usr/bin/install -m 0755 "$node_bin" "$staged_node_dir/node"
          cmp -s "$node_bin" "$staged_node_dir/node"
          printf '%s\n' "$staged_node_dir" >> "$GITHUB_PATH"

      - name: Install runtime dependencies (Linux)
        if: matrix.target.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq bubblewrap apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile"
          test -x /usr/sbin/apparmor_parser
          sudo /usr/sbin/apparmor_parser -r -W "$profile"
          test -x /usr/bin/bwrap
          /usr/bin/bwrap --help | grep -Fq -- '--perms'
          /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / /bin/true

      - name: Install runtime dependencies (macOS)
        if: matrix.target.os == 'Darwin'
        run: brew install bash jq

      - name: Install all integrity-pinned native host CLIs
        run: >-
          npm ci
          --prefix scripts/dev/native-host
          --ignore-scripts
          --no-audit
          --no-fund

      - name: Build one archive and certify the fail-closed four-host chain
        env:
          EVIDENCE_PATH: native-host-evidence/awm-chain-${{ matrix.target.id }}.json
        run: |
          set -euo pipefail
          MAINFRAME_BASH="$(command -v bash)"
          if [[ "${{ matrix.target.os }}" == "Darwin" ]]; then
            MAINFRAME_BASH="$(brew --prefix bash)/bin/bash"
          fi
          export MAINFRAME_BASH
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"

          "$MAINFRAME_BASH" scripts/dev/native-host/assert-runner-platform.sh \
            "$EXPECTED_PLATFORM_ID" "$EXPECTED_OS" "$EXPECTED_ARCH" \
            "$EXPECTED_SYSTEM_LIBC"

          # Exercise installed candidates even when promotion evidence expires.
          "$MAINFRAME_BASH" scripts/generate-sbom.sh
          "$MAINFRAME_BASH" scripts/generate-sbom.sh --check
          "$MAINFRAME_BASH" scripts/build-release-archive.sh --verify
          "$MAINFRAME_BASH" scripts/build-release-archive.sh
          archive="dist/mainframe-$(tr -d '[:space:]' < VERSION).tar.gz"
          archive_sha="$(python3 -c \
            'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' \
            "$archive")"

          "$MAINFRAME_BASH" scripts/dev/certify-native-awm-chain.sh \
            --archive "$archive" \
            --output "$EVIDENCE_PATH"
          python3 scripts/dev/native-host/validate-evidence.py \
            scripts/dev/native-host/awm-chain-evidence.schema.json \
            "$EVIDENCE_PATH"

          expected_hosts="$(jq -c '.' scripts/dev/native-host/hosts.json)"
          codex_key="$(jq -r '.platform.os + "-" + .platform.arch' "$EVIDENCE_PATH")"
          native_key="$(jq -r \
            '.platform.os + "-" + .platform.arch + "-" + .platform.libc' \
            "$EVIDENCE_PATH")"
          expected_codex_platform="$(jq -cer --arg key "$codex_key" \
            '.codex.platforms[$key]' scripts/dev/native-host/hosts.json)"
          expected_copilot_platform="$(jq -cer --arg key "$native_key" \
            '.copilot.platforms[$key]' scripts/dev/native-host/hosts.json)"
          expected_claude_platform="$(jq -cer --arg key "$native_key" \
            '.claude.platforms[$key]' scripts/dev/native-host/hosts.json)"
          jq -e \
            --arg archive_sha "$archive_sha" \
            --arg version "$(tr -d '[:space:]' < VERSION)" \
            --arg os "$(uname -s)" \
            --arg arch "$(uname -m)" \
            --argjson manifest "$expected_hosts" \
            --argjson codex_platform "$expected_codex_platform" \
            --argjson copilot_platform "$expected_copilot_platform" \
            --argjson claude_platform "$expected_claude_platform" '
              (.negative_probe.provider_command_sha256) as $command_sha |
              .certification == "native-awm-chain-execution-certified" and
              .mainframe.version == $version and
              .mainframe.archive_sha256 == $archive_sha and
              .mainframe.archive_origin == "external-input" and
              .mainframe.installation_count == 1 and
              .mainframe.installed_runtime_read_only == true and
              .platform.os == $os and .platform.os == env.EXPECTED_OS and
              .platform.arch == $arch and .platform.arch == env.EXPECTED_ARCH and
              .platform.system_libc == env.EXPECTED_SYSTEM_LIBC and
              .platform.libc == .platform.system_libc and
              .execution_boundaries == {
                shared_project: true, shared_awm_root: true,
                shared_awm_session: true, same_uid: true, shared_tmpdir: true,
                separate_home: true, separate_xdg_config: true,
                separate_xdg_state: true, separate_xdg_cache: true,
                fresh_separate_host_state: true, os_process_isolation: false,
                container_isolation: false,
                isolation_scope: "fresh-filesystem-host-state-not-os-sandbox"
              } and
              .awm.backend == "file" and
              .awm.schema_version == 2 and
              .awm.root_scope == "private-project-local" and
              .awm.root_mode == "700" and
              .awm.private_artifact_mode == "600" and
              .awm.private_modes_verified == true and
              .awm.checkpoint_count == 5 and .awm.chain_length == 4 and
              .awm.final_key == "chain.claude" and
              (.awm.context_proof as $p |
                $p.actual_bytes > 0 and $p.actual_bytes <= $p.max_bytes and
                $p.actual_tokens ==
                  ((($p.actual_bytes + $p.bytes_per_token - 1) /
                    $p.bytes_per_token) | floor) and
                $p.provenance_session_verified == true and
                $p.final_value_included == true) and
              (.awm.handoff_proof as $p |
                $p.actual_bytes > 0 and $p.actual_bytes <= $p.max_bytes and
                $p.actual_tokens ==
                  ((($p.actual_bytes + $p.bytes_per_token - 1) /
                    $p.bytes_per_token) | floor) and
                $p.nested_context_actual_bytes > 0 and
                $p.nested_context_actual_tokens ==
                  ((($p.nested_context_actual_bytes + $p.bytes_per_token - 1) /
                    $p.bytes_per_token) | floor) and
                $p.provenance_session_verified == true and
                $p.nested_context_verified == true and
                $p.final_value_included == true and
                $p.persisted_byte_equal == true) and
              .hosts.gemini.version == $manifest.gemini.version and
              .hosts.codex.version == $manifest.codex.version and
              .hosts.codex.platform_package == $codex_platform.package_alias and
              .hosts.copilot.version == $manifest.copilot.version and
              .hosts.copilot.platform_package == $copilot_platform.package and
              .hosts.claude.version == $manifest.claude.version and
              .hosts.claude.platform_package == $claude_platform.package and
              ([.hosts[] | select(
                .version_command_verified == true and
                .fresh_separate_host_state == true and
                .provider_command_sha256 == $command_sha and
                .provider_requests == 2 and
                .tool_calls == 1 and .gateway_risk == "low" and
                .gateway_rule == "none" and .gateway_decision == "allow" and
                .gateway_records == 1 and .audit_mode == "600" and
                .gateway_observation_scope ==
                  "host-event-tool-policy-tuple-only" and
                .gateway_command_correlation_available == false and
                .success_marker_seen == true)] | length) == 4 and
              .hosts.gemini.provider_request_hygiene_checks == 0 and
              ([.hosts.codex, .hosts.copilot, .hosts.claude] |
                all(.provider_request_hygiene_checks == 2 and
                    .provider_request_guard_mode ==
                      "reject-awm-values-and-root-no-request-persistence")) and
              .evidence_hygiene == {
                raw_seed_embedded: false,
                checkpoint_values_embedded: false,
                credentials_embedded: false,
                absolute_home_paths_embedded: false,
                provider_requests_embedded: false,
                private_run_artifacts_embedded: false,
                loopback_requests_persisted: false,
                loopback_private_values_observed: false,
                loopback_awm_root_observed: false,
                loopback_disposable_paths_may_be_observed: true
              } and
              .negative_probe.executed == true and
              .negative_probe.positive_certificate_binding == true and
              .negative_probe.run_order ==
                "after-gemini-before-positive-codex" and
              .negative_probe.provider_requests == 2 and
              .negative_probe.provider_status ==
                "expected-missing-predecessor" and
              .negative_probe.missing_predecessor_marker_seen == true and
              .negative_probe.tool_exit_code == 42 and
              .negative_probe.tool_result_nonzero == true and
              .negative_probe.checkpoint_written == false and
              .negative_probe.scratch_empty == true and
              .negative_probe.later_hosts_started_before_rejection == false and
              .negative_probe.gateway_command_correlation_available == false
            ' "$EVIDENCE_PATH" >/dev/null

      - name: Upload native AWM-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-host-awm-chain-${{ matrix.target.id }}
          if-no-files-found: warn
          retention-days: 14
          path: native-host-evidence/awm-chain-${{ matrix.target.id }}.json

  homebrew-package:
    name: Homebrew candidate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@726029484f4d6a3cc19c735a5fb22595f8655a9a # pinned 2026-08-04
        with:
          core: false
          cask: false

      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install bash jq

      - name: Install first-use shell dependency (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Build archive and formula candidate
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          MAINFRAME_BASH="$(command -v bash)"
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            MAINFRAME_BASH="$(brew --prefix bash)/bin/bash"
          fi
          "$MAINFRAME_BASH" scripts/generate-sbom.sh
          "$MAINFRAME_BASH" scripts/build-release-archive.sh --verify
          "$MAINFRAME_BASH" scripts/build-release-archive.sh
          "$MAINFRAME_BASH" scripts/dev/generate-homebrew-formula.sh
          ruby -c dist/mainframe.rb

      - name: Install and test from an ephemeral tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ENV_HINTS: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_GIT_NAME: MAINFRAME CI
          HOMEBREW_GIT_EMAIL: mainframe-ci@example.invalid
        run: |
          set -euo pipefail
          tap=mainframe/ci
          formula="$tap/mainframe"
          version="$(tr -d '[:space:]' < VERSION)"
          developer_was_enabled=false
          if brew developer state 2>&1 | grep -Fq 'Developer mode is enabled'; then
            developer_was_enabled=true
          fi
          cleanup() {
            brew uninstall "$formula" >/dev/null 2>&1 || true
            brew untap "$tap" >/dev/null 2>&1 || true
            if [[ "$developer_was_enabled" == "true" ]]; then
              brew developer on >/dev/null 2>&1 || true
            else
              brew developer off >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          brew tap-new "$tap"
          tap_dir="$(brew --repository "$tap")"
          cp dist/mainframe.rb "$tap_dir/Formula/mainframe.rb"

          cache_path="$(brew --cache --build-from-source "$formula")"
          mkdir -p "$(dirname "$cache_path")"
          cp "dist/mainframe-${version}.tar.gz" "$cache_path"

          brew style --formula "$formula"
          brew audit --strict --formula "$formula"
          brew install --build-from-source "$formula"
          brew test "$formula"

          prefix="$(brew --prefix "$formula")"
          brew_prefix="$(brew --prefix)"
          "$prefix/bin/mainframe" doctor
          fresh_root="$(mktemp -d "$RUNNER_TEMP/mainframe-homebrew-first-use.XXXXXX")"
          fresh_root="$(cd "$fresh_root" && pwd -P)"
          fresh_home="$fresh_root/home"
          fresh_project="$fresh_root/project"
          mkdir "$fresh_home" "$fresh_project"
          mainframe_bash="$(brew --prefix bash)/bin/bash"
          for caller_shell in "$mainframe_bash" /bin/zsh; do
            setup_log="$RUNNER_TEMP/mainframe-homebrew-setup-${caller_shell##*/}.log"
            HOME="$fresh_home" SHELL="$caller_shell" PATH="$prefix/bin:$PATH" \
              "$caller_shell" -c 'exec "$1" setup --project "$2"' \
              mainframe-first-use "$prefix/bin/mainframe" "$fresh_project" \
              | tee "$setup_log"
            grep -Fq 'Mode: discovery only (strictly read-only)' "$setup_log"
            if grep -Fq 'mainframe pi install --dry-run' "$setup_log"; then
              echo "ERROR: fresh setup offered Pi activation before Pi initialized its user directory" >&2
              exit 1
            fi
          done
          set +e
          pi_doctor="$(HOME="$fresh_home" PATH="$prefix/bin:$PATH" \
            "$prefix/bin/mainframe" pi doctor --json 2>&1)"
          pi_doctor_rc=$?
          set -e
          test "$pi_doctor_rc" -eq 2
          jq -e '.overall.ready == false and .pi.executed == false' \
            <<<"$pi_doctor" >/dev/null
          test -z "$(find "$fresh_home" -mindepth 1 -print -quit)"
          test -z "$(find "$fresh_project" -mindepth 1 -print -quit)"
          project="$RUNNER_TEMP/mainframe-homebrew-protected-project"
          mkdir -p "$project"
          PATH="$prefix/bin:$PATH" "$prefix/bin/mainframe" \
            activate gemini --project "$project" --enforce
          PATH="$prefix/bin:$PATH" "$prefix/bin/mainframe" \
            protect status gemini --project "$project" | tee "$RUNNER_TEMP/mainframe-homebrew-protect.log"
          grep -Fq 'Static readiness: READY' "$RUNNER_TEMP/mainframe-homebrew-protect.log"
          test -f "$brew_prefix/etc/bash_completion.d/mainframe"
          test -f "$brew_prefix/share/zsh/site-functions/_mainframe"
          test -f "$prefix/libexec/SHA256SUMS"

      - name: Upload tested Homebrew candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homebrew-package-${{ runner.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/mainframe.rb
            dist/mainframe-*.tar.gz.sha256

  # Build/package execution and OIDC attestation are deliberately split. This
  # job can construct and inspect candidates, but it has no signing authority.
  mcp-package-build:
    name: Build isolated MAINFRAME MCP package candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          checksum: aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967
          enable-cache: false

      - name: Build wheel, sdist, and exact runtime outside the checkout
        run: |
          set -euo pipefail
          package_out="$RUNNER_TEMP/mainframe-mcp-candidate"
          runtime_out="$RUNNER_TEMP/mainframe-mcp-runtime"
          mkdir -p "$package_out" "$runtime_out"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          # Candidate construction carries no claim or publishing authority.
          # The separate release-readiness job remains mandatory for promotion.
          bash scripts/generate-sbom.sh
          bash scripts/generate-sbom.sh --check
          bash scripts/build-release-archive.sh --output-dir "$runtime_out" >/dev/null
          cp "$runtime_out/mainframe-10.2.0.tar.gz" "$package_out/"
          python3 .github/scripts/build-mcp-package.py \
            --source mcp \
            --runtime-archive "$package_out/mainframe-10.2.0.tar.gz" \
            --output-dir "$package_out"
          python3 - "$package_out" <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          expected = (
              "mainframe_mcp-10.2.0-py3-none-any.whl",
              "mainframe_mcp-10.2.0.tar.gz",
              "mainframe-10.2.0.tar.gz",
          )
          with (root / "mainframe-mcp-candidate.sha256").open("w", encoding="ascii") as output:
              for name in expected:
                  path = root / name
                  if path.is_symlink() or not path.is_file():
                      raise SystemExit(f"missing regular candidate artifact: {name}")
                  output.write(f"{sha256(path.read_bytes()).hexdigest()}  {name}\n")
          PY

      - name: Inspect package contents and immutable metadata without importing it
        run: |
          python3 - "$RUNNER_TEMP/mainframe-mcp-candidate" <<'PY'
          from email.parser import BytesParser
          from email.policy import compat32
          from pathlib import PurePosixPath, Path
          import sys
          import tarfile
          import zipfile

          root = Path(sys.argv[1])
          wheel = root / "mainframe_mcp-10.2.0-py3-none-any.whl"
          sdist = root / "mainframe_mcp-10.2.0.tar.gz"
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata = BytesParser(policy=compat32).parsebytes(
                  archive.read("mainframe_mcp-10.2.0.dist-info/METADATA")
              )
              wheel_names = set(names)
          assert {name.split("/", 1)[0] for name in names} == {
              "mainframe_mcp",
              "mainframe_mcp-10.2.0.data",
              "mainframe_mcp-10.2.0.dist-info",
          }
          assert metadata["Name"] == "mainframe-mcp"
          assert metadata["Version"] == "10.2.0"
          assert metadata["Requires-Python"] == ">=3.10, <3.15"
          assert metadata.get_all("Requires-Dist") == ["mcp==1.29.0"]
          assert "mainframe_mcp-10.2.0.dist-info/entry_points.txt" not in wheel_names
          assert {
              "mainframe_mcp-10.2.0.data/scripts/mainframe-mcp",
              "mainframe_mcp-10.2.0.data/scripts/mainframe-mcp-server",
          }.issubset(wheel_names)
          with tarfile.open(sdist, "r:gz") as archive:
              sdist_names = archive.getnames()
          for raw in [*names, *sdist_names]:
              normalized = raw.removeprefix("mainframe_mcp-10.2.0/").rstrip("/")
              parts = PurePosixPath(normalized).parts
              assert not normalized.startswith(("mcp/", "tests/", "lib/", "config/"))
              if normalized.startswith("bin/"):
                  assert normalized in {
                      "bin/mainframe-mcp", "bin/mainframe-mcp-server"
                  }
              assert not any(part in {
                  "__pycache__", ".pytest_cache", ".ruff_cache", ".venv", "dist"
              } for part in parts)
              assert normalized not in {
                  "FUNCTIONS.json", "MANIFEST.json", "SHA256SUMS", "VERSION"
              }
          PY

      - name: Upload unexecuted package candidate
        id: upload_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mainframe-mcp-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/mainframe-mcp-candidate/mainframe_mcp-10.2.0-py3-none-any.whl
            ${{ runner.temp }}/mainframe-mcp-candidate/mainframe_mcp-10.2.0.tar.gz
            ${{ runner.temp }}/mainframe-mcp-candidate/mainframe-10.2.0.tar.gz
            ${{ runner.temp }}/mainframe-mcp-candidate/mainframe-mcp-candidate.sha256

  mcp-package-test:
    name: Test downloaded MCP package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: mcp-package-build
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout tests without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          enable-cache: false

      - name: Install modern Bash (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install bash
          echo "MAINFRAME_BASH=$(brew --prefix bash)/bin/bash" >> "$GITHUB_ENV"

      - name: Install integrity-pinned BATS
        run: |
          git clone --no-checkout --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git tests/bats
          git -C tests/bats checkout --detach "$BATS_CORE_COMMIT"
          test "$(git -C tests/bats rev-parse HEAD)" = "$BATS_CORE_COMMIT"

      - name: Download exact unexecuted package candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.mcp-package-build.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/mainframe-mcp-candidate
          merge-multiple: true

      - name: Verify downloaded candidate digests
        run: |
          python3 - "$RUNNER_TEMP/mainframe-mcp-candidate" <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          manifest = root / "mainframe-mcp-candidate.sha256"
          records = manifest.read_text(encoding="ascii").splitlines()
          assert len(records) == 3
          expected_names = {
              "mainframe_mcp-10.2.0-py3-none-any.whl",
              "mainframe_mcp-10.2.0.tar.gz",
              "mainframe-10.2.0.tar.gz",
          }
          observed = set()
          for record in records:
              match = re.fullmatch(r"([0-9a-f]{64})  ([A-Za-z0-9_.-]+)", record)
              assert match, record
              digest, name = match.groups()
              observed.add(name)
              path = root / name
              assert path.is_file() and not path.is_symlink()
              assert sha256(path.read_bytes()).hexdigest() == digest
          assert observed == expected_names
          PY

      - name: Prepare hash-verified dependency wheelhouse
        run: |
          set -euo pipefail
          requirements="$RUNNER_TEMP/mainframe-mcp-requirements.txt"
          wheelhouse="$RUNNER_TEMP/mainframe-mcp-wheelhouse"
          mkdir -p "$wheelhouse"
          uv export --locked --project mcp --no-dev --no-emit-project \
            --output-file "$requirements"
          PIP_NO_CONFIG_FILE=/dev/null python3 -m pip download \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --dest "$wheelhouse" \
            --requirement "$requirements"

      - name: Exercise package and exact runtime from outside the checkout
        env:
          MAINFRAME_MCP_PACKAGE_ARTIFACT_DIR: ${{ runner.temp }}/mainframe-mcp-candidate
          MAINFRAME_MCP_RUNTIME_ARCHIVE: ${{ runner.temp }}/mainframe-mcp-candidate/mainframe-10.2.0.tar.gz
          MAINFRAME_MCP_REQUIRE_PIPX_OFFLINE: '1'
          MAINFRAME_MCP_REQUIRE_UVX_OFFLINE: '1'
          MAINFRAME_MCP_UVX_WHEELHOUSE: ${{ runner.temp }}/mainframe-mcp-wheelhouse
        run: |
          tests/bats/bin/bats --formatter tap --print-output-on-failure \
            tests/mcp_package.bats

  # This clean, tag-only job never checks out or executes candidate code. It
  # gains OIDC only after both unprivileged platform executions have passed.
  mcp-package-attestation:
    name: Attest tested MCP package candidate
    runs-on: ubuntu-latest
    needs: [mcp-package-build, mcp-package-test, release-tag-identity, release-readiness]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      artifact-metadata: write
      contents: read
      attestations: write
      id-token: write
    outputs:
      candidate_artifact_id: ${{ needs.mcp-package-build.outputs.candidate_artifact_id }}
    steps:
      - name: Download exact tested package candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.mcp-package-build.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/mainframe-mcp-candidate
          merge-multiple: true

      - name: Attest tested MAINFRAME MCP wheel
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/mainframe-mcp-candidate/mainframe_mcp-10.2.0-py3-none-any.whl

      - name: Attest tested MAINFRAME MCP source distribution
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/mainframe-mcp-candidate/mainframe_mcp-10.2.0.tar.gz

      - name: Attest deterministic MAINFRAME MCP runtime-pair manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/mainframe-mcp-candidate/mainframe-mcp-candidate.sha256

  release-build:
    name: Build and attest release
    runs-on: ubuntu-latest
    needs: [lint, release-readiness, trust-gates, test-safety, bash-44-compat, test-linux, test-macos, pi-compatibility, pi-cell-attestation, stable-core-conformance-linux, test-bindings, archive-cross-platform, shell-onboarding, installed-awm-handoff-aggregate, native-host-gemini, native-host-codex, native-host-copilot, native-host-claude, native-host-awm-chain, homebrew-package, mcp-package-attestation, release-tag-identity]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      artifact-metadata: write
      contents: read
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_ref_sha: ${{ steps.version.outputs.tag_ref_sha }}
      tag_commit: ${{ steps.version.outputs.tag_commit }}
      release_archive_sha256: ${{ steps.release_evidence.outputs.archive_sha256 }}
      release_checksum_sha256: ${{ steps.release_evidence.outputs.checksum_sha256 }}
      release_sbom_sha256: ${{ steps.release_evidence.outputs.sbom_sha256 }}
      release_formula_sha256: ${{ steps.release_evidence.outputs.formula_sha256 }}
      release_evidence_manifest_sha256: ${{ steps.release_evidence.outputs.manifest_sha256 }}
      release_evidence_bundle_sha256: ${{ steps.release_evidence.outputs.bundle_sha256 }}
      release_pi_evidence_sha256: ${{ steps.release_evidence.outputs.pi_evidence_sha256 }}
      release_mcp_wheel_sha256: ${{ steps.mcp_release_assets.outputs.wheel_sha256 }}
      release_mcp_sdist_sha256: ${{ steps.mcp_release_assets.outputs.sdist_sha256 }}
      release_mcp_manifest_sha256: ${{ steps.mcp_release_assets.outputs.manifest_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: version
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(bash scripts/dev/release.sh --version)
          if [[ "$GITHUB_REF_NAME" != "v$CURRENT_VERSION" ]]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match VERSION v$CURRENT_VERSION" >&2
            exit 1
          fi
          if [[ "${{ github.event.created }}" != "true" ]]; then
            echo "ERROR: release workflow only accepts a newly created tag ref" >&2
            exit 1
          fi
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          tag_ref_sha="$(git rev-parse "$tag_ref")"
          tag_commit="$(git rev-parse "$tag_ref^{commit}")"
          if [[ "$CURRENT_VERSION" != "${{ needs.release-tag-identity.outputs.version }}" ||
                "$tag_ref_sha" != "${{ needs.release-tag-identity.outputs.tag_ref_sha }}" ||
                "$tag_commit" != "${{ needs.release-tag-identity.outputs.tag_commit }}" ]]; then
            echo "ERROR: release tag identity changed after the unprivileged identity gate" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]]; then
            echo "ERROR: checkout does not match the peeled release-tag commit" >&2
            exit 1
          fi
          git fetch --force origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "ERROR: release tag commit is not reachable from origin/main" >&2
            exit 1
          fi
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_ref_sha=$tag_ref_sha" >> "$GITHUB_OUTPUT"
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$tag_commit")" >> "$GITHUB_ENV"

      - name: Prepare deterministic release metadata
        run: |
          bash scripts/dev/release.sh --prepare
          bash scripts/dev/release.sh --check

      - name: Build and verify runtime archive
        run: |
          set -euo pipefail
          bash scripts/build-release-archive.sh --verify
          bash scripts/build-release-archive.sh
          bash scripts/dev/generate-homebrew-formula.sh
          cd dist
          sha256sum -c "mainframe-${{ steps.version.outputs.version }}.tar.gz.sha256"
          test -s "mainframe-${{ steps.version.outputs.version }}.sbom.json"
          ruby -c mainframe.rb

      - name: Download the tested MCP-bound runtime and packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.mcp-package-attestation.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/mainframe-mcp-candidate
          merge-multiple: true

      - name: Verify exact MCP release candidate
        id: mcp_release_assets
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/mainframe-mcp-candidate"
          version="${{ steps.version.outputs.version }}"
          wheel="$candidate/mainframe_mcp-${version}-py3-none-any.whl"
          sdist="$candidate/mainframe_mcp-${version}.tar.gz"
          runtime="$candidate/mainframe-${version}.tar.gz"
          pair_manifest="$candidate/mainframe-mcp-candidate.sha256"
          release_runtime="dist/mainframe-${version}.tar.gz"
          python3 - "$candidate" "$version" "$release_runtime" <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import re
          import stat
          import sys
          import tarfile
          import zipfile

          root = Path(sys.argv[1])
          version = sys.argv[2]
          release_runtime = Path(sys.argv[3])
          wheel_name = f"mainframe_mcp-{version}-py3-none-any.whl"
          sdist_name = f"mainframe_mcp-{version}.tar.gz"
          runtime_name = f"mainframe-{version}.tar.gz"
          manifest_name = "mainframe-mcp-candidate.sha256"
          expected_inventory = sorted(
              [wheel_name, sdist_name, runtime_name, manifest_name]
          )
          if root.is_symlink() or not root.is_dir():
              raise SystemExit("MCP candidate root must be a non-symlink directory")
          observed_inventory = []
          for path in root.iterdir():
              mode = path.lstat().st_mode
              if not stat.S_ISREG(mode):
                  raise SystemExit(f"unsafe MCP candidate entry: {path.name}")
              observed_inventory.append(path.name)
          if sorted(observed_inventory) != expected_inventory:
              raise SystemExit("MCP candidate artifact inventory is not exact")

          manifest = root / manifest_name
          try:
              manifest_text = manifest.read_bytes().decode("ascii")
          except UnicodeDecodeError as error:
              raise SystemExit("MCP runtime-pair manifest must be ASCII") from error
          if not manifest_text.endswith("\n"):
              raise SystemExit("MCP runtime-pair manifest must end with one newline")
          records = manifest_text.splitlines()
          expected_names = [wheel_name, sdist_name, runtime_name]
          if len(records) != len(expected_names):
              raise SystemExit("MCP runtime-pair manifest record count is not exact")
          for record, expected_name in zip(records, expected_names, strict=True):
              match = re.fullmatch(r"([0-9a-f]{64})  ([A-Za-z0-9_.-]+)", record)
              if match is None or match.group(2) != expected_name:
                  raise SystemExit("MCP runtime-pair manifest order or syntax is invalid")
              artifact = root / expected_name
              digest = sha256(artifact.read_bytes()).hexdigest()
              if digest != match.group(1):
                  raise SystemExit(f"MCP candidate digest mismatch: {expected_name}")

          runtime_path = root / runtime_name
          if sha256(runtime_path.read_bytes()).digest() != sha256(
              release_runtime.read_bytes()
          ).digest():
              raise SystemExit("MCP-tested runtime differs from release runtime")
          with tarfile.open(release_runtime, "r:gz") as archive:
              members = [member for member in archive.getmembers() if member.name == "SHA256SUMS"]
              assert len(members) == 1 and members[0].isfile()
              source = archive.extractfile(members[0])
              assert source is not None
              inventory_digest = sha256(source.read()).hexdigest()
          with zipfile.ZipFile(root / wheel_name) as wheel:
              binding = wheel.read("mainframe_mcp/_runtime_release.py").decode("utf-8")
          with tarfile.open(root / sdist_name, "r:gz") as package:
              member = package.getmember(
                  f"mainframe_mcp-{version}/src/mainframe_mcp/_runtime_release.py"
              )
              source = package.extractfile(member)
              assert source is not None
              sdist_binding = source.read().decode("utf-8")
          pattern = r"EXPECTED_RUNTIME_INVENTORY_SHA256 = '([0-9a-f]{64})'"
          for label, content in (("wheel", binding), ("sdist", sdist_binding)):
              matches = re.findall(pattern, content)
              if matches != [inventory_digest]:
                  raise SystemExit(
                      f"{label} runtime binding does not match the release inventory"
                  )
          PY
          printf 'wheel_sha256=%s\n' \
            "$(sha256sum "$wheel" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'sdist_sha256=%s\n' \
            "$(sha256sum "$sdist" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'manifest_sha256=%s\n' \
            "$(sha256sum "$pair_manifest" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Verify exact MCP package provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/mainframe-mcp-candidate"
          version="${{ steps.version.outputs.version }}"
          expected_invocation_prefix="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/"
          for subject in \
            "$candidate/mainframe_mcp-${version}-py3-none-any.whl" \
            "$candidate/mainframe_mcp-${version}.tar.gz" \
            "$candidate/mainframe-mcp-candidate.sha256"; do
            subject_name="${subject##*/}"
            subject_sha="$(sha256sum "$subject" | awk '{print $1}')"
            verification="$(gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/test.yml" \
              --signer-digest "${{ steps.version.outputs.tag_commit }}" \
              --source-digest "${{ steps.version.outputs.tag_commit }}" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --limit 100 \
              --format json)"
            jq -e \
              --arg name "$subject_name" \
              --arg sha "$subject_sha" \
              --arg prefix "$expected_invocation_prefix" \
              --argjson max_attempt "$GITHUB_RUN_ATTEMPT" '
                any(.[];
                  (.verificationResult.statement.predicateType ==
                    "https://slsa.dev/provenance/v1" and
                   .verificationResult.statement.subject == [
                     {name: $name, digest: {sha256: $sha}}
                   ] and
                   .verificationResult.signature.certificate.runnerEnvironment ==
                     "github-hosted") and
                  ((.verificationResult.statement.predicate.runDetails.metadata.invocationId) as
                    $invocation |
                    $invocation ==
                      .verificationResult.signature.certificate.runInvocationURI and
                    ($invocation | startswith($prefix)) and
                    (($invocation | ltrimstr($prefix)) |
                      test("^[1-9][0-9]*$")) and
                    (($invocation | ltrimstr($prefix) | tonumber) <= $max_attempt))
                )
              ' <<<"$verification" >/dev/null
          done

      - name: Stage provenance-verified MCP release assets
        env:
          EXPECTED_MCP_WHEEL_SHA: ${{ steps.mcp_release_assets.outputs.wheel_sha256 }}
          EXPECTED_MCP_SDIST_SHA: ${{ steps.mcp_release_assets.outputs.sdist_sha256 }}
          EXPECTED_MCP_MANIFEST_SHA: ${{ steps.mcp_release_assets.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/mainframe-mcp-candidate"
          version="${{ steps.version.outputs.version }}"
          wheel="$candidate/mainframe_mcp-${version}-py3-none-any.whl"
          sdist="$candidate/mainframe_mcp-${version}.tar.gz"
          pair_manifest="$candidate/mainframe-mcp-candidate.sha256"
          test ! -e "dist/${wheel##*/}"
          test ! -e "dist/${sdist##*/}"
          test ! -e "dist/${pair_manifest##*/}"
          install -m 0644 -- "$wheel" "dist/${wheel##*/}"
          install -m 0644 -- "$sdist" "dist/${sdist##*/}"
          install -m 0644 -- "$pair_manifest" "dist/${pair_manifest##*/}"
          test "$(sha256sum "dist/${wheel##*/}" | awk '{print $1}')" = \
            "$EXPECTED_MCP_WHEEL_SHA"
          test "$(sha256sum "dist/${sdist##*/}" | awk '{print $1}')" = \
            "$EXPECTED_MCP_SDIST_SHA"
          test "$(sha256sum "dist/${pair_manifest##*/}" | awk '{print $1}')" = \
            "$EXPECTED_MCP_MANIFEST_SHA"

      - name: Download shell-onboarding evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: shell-onboarding-*
          path: gate-evidence/shell-onboarding
          merge-multiple: true

      - name: Download public installed AWM handoff aggregate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installed-awm-handoff-aggregate
          path: gate-evidence/installed-awm-handoff

      - name: Download Gemini native-host evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-host-gemini-*
          path: gate-evidence/native-host/gemini
          merge-multiple: true

      - name: Download Codex native-host evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-host-codex-*
          path: gate-evidence/native-host/codex
          merge-multiple: true

      - name: Download Copilot native-host evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-host-copilot-*
          path: gate-evidence/native-host/copilot
          merge-multiple: true

      - name: Download Claude Code native-host evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-host-claude-*
          path: gate-evidence/native-host/claude
          merge-multiple: true

      - name: Download four-host AWM-chain evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-host-awm-chain-*
          path: gate-evidence/native-host/awm-chain
          merge-multiple: true

      - name: Download tested Homebrew candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: homebrew-package-*
          path: gate-evidence/homebrew

      - name: Download exact-candidate Pi evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pi-candidate-*
          path: gate-evidence/pi
          merge-multiple: true

      - name: Verify exact Pi cell attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_invocation="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          mapfile -t pi_cell_receipts < <(
            find gate-evidence/pi -mindepth 1 -maxdepth 1 \
              -type f -name 'pi-cell-*.json' | sort
          )
          test "${#pi_cell_receipts[@]}" -eq 6
          expected_index=0
          for pi_id in fork-0.84.2 upstream-0.73.1; do
            for target_id in \
              Darwin-arm64-none Darwin-x86_64-none Linux-x86_64-glibc; do
              cell_receipt="gate-evidence/pi/pi-cell-${pi_id}-${target_id}.json"
              test "${pi_cell_receipts[$expected_index]}" = "$cell_receipt"
              expected_index=$((expected_index + 1))
              test "$(jq -er '.cell_id' "$cell_receipt")" = "${pi_id}@${target_id}"
              test "$(jq -er '.source.workflow_run_id' "$cell_receipt")" = \
                "$GITHUB_RUN_ID"
              test "$(jq -er '.source.workflow_run_attempt' "$cell_receipt")" = \
                "$GITHUB_RUN_ATTEMPT"
              test "$(jq -er '.source.commit_sha' "$cell_receipt")" = \
                "${{ steps.version.outputs.tag_commit }}"
              test "$(jq -er '.source.ref' "$cell_receipt")" = "$GITHUB_REF"
              cell_name="${cell_receipt##*/}"
              cell_sha="$(sha256sum "$cell_receipt" | awk '{print $1}')"
              verification="$(gh attestation verify "$cell_receipt" \
                --repo "$GITHUB_REPOSITORY" \
                --predicate-type https://slsa.dev/provenance/v1 \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/test.yml" \
                --signer-digest "${{ steps.version.outputs.tag_commit }}" \
                --source-digest "${{ steps.version.outputs.tag_commit }}" \
                --source-ref "$GITHUB_REF" \
                --deny-self-hosted-runners \
                --limit 100 \
                --format json)"
              jq -e \
                --arg name "$cell_name" \
                --arg sha "$cell_sha" \
                --arg invocation "$expected_invocation" '
                  any(.[];
                    .verificationResult.statement.predicateType ==
                      "https://slsa.dev/provenance/v1" and
                    .verificationResult.statement.subject == [
                      {name: $name, digest: {sha256: $sha}}
                    ] and
                    .verificationResult.statement.predicate.runDetails.metadata.invocationId ==
                      $invocation and
                    .verificationResult.signature.certificate.runInvocationURI ==
                      $invocation and
                    .verificationResult.signature.certificate.runnerEnvironment ==
                      "github-hosted")
                ' <<<"$verification" >/dev/null
            done
          done

      - name: Download Linux exact-candidate conformance evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-exact-candidate-conformance
          path: gate-evidence/stable-core/linux

      - name: Bind gate evidence to final release bytes
        id: release_evidence
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TAG_REF_SHA: ${{ steps.version.outputs.tag_ref_sha }}
          TAG_COMMIT: ${{ steps.version.outputs.tag_commit }}
        run: |
          set -euo pipefail
          archive="dist/mainframe-${RELEASE_VERSION}.tar.gz"
          checksum="${archive}.sha256"
          archive_sha="$(sha256sum "$archive" | awk '{print $1}')"

          installed_awm_root="gate-evidence/installed-awm-handoff"
          test -d "$installed_awm_root"
          test ! -L "$installed_awm_root"
          test -z "$(find "$installed_awm_root" -type l -print -quit)"
          mapfile -t installed_awm_files < <(
            find "$installed_awm_root" -type f -print | sort
          )
          test "${#installed_awm_files[@]}" -eq 7
          python3 -I -S -B - \
            "$installed_awm_root" "$archive_sha" \
            "evals/agent-impact/installed-awm-handoff-evidence.schema.json" <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          expected_archive_sha = sys.argv[2]
          schema_path = Path(sys.argv[3])
          claim = "installed-candidate-awm-handoff-mechanism-conformance-only"
          expected = [
              ("Darwin-arm64-none", "bash"),
              ("Darwin-arm64-none", "zsh"),
              ("Darwin-x86_64-none", "bash"),
              ("Darwin-x86_64-none", "zsh"),
              ("Linux-x86_64-glibc", "bash"),
              ("Linux-x86_64-glibc", "zsh"),
          ]

          def pairs(values):
              result = {}
              for key, value in values:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def load(path):
              assert path.is_file() and not path.is_symlink(), path
              raw = path.read_bytes()
              assert len(raw) <= 1024 * 1024, path
              value = json.loads(
                  raw.decode("utf-8", errors="strict"),
                  object_pairs_hook=pairs,
                  parse_constant=lambda value: (_ for _ in ()).throw(
                      ValueError(f"non-finite JSON number: {value}")
                  ),
              )
              return value, raw

          schema, _ = load(schema_path)
          assert schema["properties"]["claim_scope"]["const"] == claim
          aggregate, _ = load(root / "aggregate.json")
          assert set(aggregate) == {
              "schema_version", "kind", "claim_scope", "status",
              "archive_sha256", "cell_count", "cells",
          }
          assert aggregate["schema_version"] == 1
          assert aggregate["kind"] == (
              "mainframe-installed-awm-handoff-matrix-aggregate"
          )
          assert aggregate["claim_scope"] == claim
          assert aggregate["status"] == "passed"
          assert aggregate["archive_sha256"] == expected_archive_sha
          assert aggregate["cell_count"] == 6
          assert len(aggregate["cells"]) == 6
          assert [
              (cell["platform_id"], cell["shell"])
              for cell in aggregate["cells"]
          ] == expected
          for index, (platform_id, shell_name) in enumerate(expected):
              evidence_path = root / "evidence" / (
                  f"{platform_id}-{shell_name}.json"
              )
              evidence, raw = load(evidence_path)
              cell = aggregate["cells"][index]
              assert set(cell) == {
                  "platform_id", "shell", "evidence_sha256",
              }
              assert cell["evidence_sha256"] == sha256(raw).hexdigest()
              assert evidence["claim_scope"] == claim
              assert evidence["status"] == "passed"
              assert evidence["candidate"]["archive_sha256"] == expected_archive_sha
              assert evidence["platform"]["id"] == platform_id
              assert evidence["shell"]["name"] == shell_name
              assert evidence["integrity"]["public_paths_embedded"] is False
              assert re.fullmatch(r"[0-9a-f]{64}", cell["evidence_sha256"])
          PY

