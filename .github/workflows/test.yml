name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  TERM: xterm-256color
  NO_COLOR: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on libraries
        run: |
          # Debug: Show shellcheck version
          shellcheck --version
          # Exclude expected warnings for library code:
          # SC1090: Non-constant source (lazy loading engine uses dynamic paths)
          # SC1091: Can't follow source (CI doesn't have files in expected paths)
          # SC2034: Variables unused (exported for library users)
          # SC2178: Nameref false positive
          # SC2053: Intentional glob patterns
          # SC2206: Intentional word splitting for arrays
          # SC2059: Intentional variable in printf for ANSI codes
          # SC1003: Backslash character, not escape
          # SC2004: Style - $/{} in arithmetic
          # SC2181: Style - $? check
          # SC2012: ls vs find (intentional)
          # SC2120/SC2119: Function args (library functions)
          # SC2016: Single quotes intentional
          # SC2155: Declare and assign
          # SC2188: Redirect for truncation
          # SC2295: Pattern matching intentional
          # SC2015: A && B || C pattern (intentional)
          # SC2030/SC2031: Variable modification in subshell (intentional)
          # SC2317: Unreachable code false positive (library functions)
          # SC2069: Intentional redirect order for capture_stderr
          # SC1130: False positive for function names using reserved words with :: (then::do)
          # SC2294: eval "$@" intentional for fluent DSL action execution
          # SC2128: False positive for scalar variables named like arrays
          # SC2319: $? after condition (intentional pattern)
          # SC2094: False positive about reading/writing same file in pipeline
          # SC1078: Regex pattern with quotes
          # SC2179: String used as array (intentional associative array patterns)
          # SC1079: Quote issues in regex patterns (intentional)
          # SC2027: Quote issues in regex patterns (intentional)
          # SC2254: Unquoted case patterns (intentional for glob matching)
          # SC1083: Literal braces (intentional for git refs like @{u})
          # SC2093: Exec redirect patterns (intentional)
          # SC1072: Parse edge cases (intentional complex patterns)
          # SC1073: Parse edge cases (intentional complex patterns)
          # SC2183: Printf format edge cases (intentional)
          # SC2221: Unreachable case patterns (intentional for regex pattern matching)
          # SC2222: Unreachable case patterns (intentional for regex pattern matching)
          # SC2076: Quoted RHS of =~ intentional for literal matching in space-delimited lists
          # SC2001: sed is appropriate for complex regex replacements
          shellcheck -x \
            -e SC1090 -e SC1091 -e SC2034 -e SC2178 -e SC2053 -e SC2206 \
            -e SC2059 -e SC1003 -e SC2004 -e SC2181 -e SC2012 \
            -e SC2120 -e SC2119 -e SC2016 -e SC2155 -e SC2188 \
            -e SC2295 -e SC2015 -e SC2030 -e SC2031 -e SC2317 -e SC2069 \
            -e SC1130 -e SC2294 -e SC2128 -e SC2319 -e SC2094 -e SC1078 \
            -e SC2179 -e SC1079 -e SC2027 -e SC2254 -e SC1083 -e SC2093 \
            -e SC1072 -e SC1073 -e SC2183 -e SC2221 -e SC2222 -e SC2076 \
            -e SC2001 \
            lib/*.sh 2>&1 | tee /tmp/shellcheck_output.txt || {
              echo "=== ShellCheck Errors ==="
              cat /tmp/shellcheck_output.txt
              exit 1
            }

      - name: Run ShellCheck on scripts
        run: |
          # Exclude expected warnings for script code:
          # SC1090: Can't follow non-constant source
          # SC2034: Variables unused (exported for users)
          # SC2064: Use single quotes (intentional variable expansion in trap)
          # SC2009: Consider pgrep (ps is more portable)
          # SC2155: Declare and assign separately
          # SC2016: Expressions don't expand in single quotes (intentional)
          # SC2086: Double quote (intentional word splitting)
          # SC2053: Intentional glob pattern matching
          # SC2012: ls vs find (intentional)
          # SC2295: Pattern matching intentional
          # SC2178: Nameref false positive
          # SC2128: Array expansion intentional
          # SC2317: Unreachable code false positive (trap-invoked functions)
          # SC2329: Function never invoked (trap-invoked functions)
          # SC1003: Single quote escaping style
          # SC2119/SC2120: usage() pattern with optional args
          find scripts -name '*.sh' -type f | xargs shellcheck -x \
            -e SC1090 -e SC2034 -e SC2064 -e SC2009 -e SC2155 \
            -e SC2016 -e SC2086 -e SC2053 -e SC2012 -e SC2295 \
            -e SC2178 -e SC2128 -e SC2317 -e SC2329 -e SC1003 \
            -e SC2119 -e SC2120

      - name: Run ShellCheck on hooks
        run: |
          # Exclude expected warnings for hook code:
          # SC1090: Can't follow non-constant source
          # SC2034: Variables unused (exported for users)
          # SC2053: Intentional glob pattern matching in [[ ]]
          # SC2155: Declare and assign separately
          find hooks -name '*.sh' -type f | xargs shellcheck -x \
            -e SC1090 -e SC2034 -e SC2053 -e SC2155

      - name: Version and registry drift check
        run: |
          # VERSION is the single source of truth; lib/common.sh, the root
          # CLI, the registry generator, and FUNCTIONS.json must all agree.
          # FUNCTIONS.json must also match a fresh generation from lib/*.sh.
          bash scripts/sync-version.sh --check

  # Safety-critical suites run with ZERO tolerance on both platforms.
  # These cover the agent execution safety stack (agent_safety), the
  # destructive-command gate (security_gate), path validation, atomic
  # writes, confirmation flows, dry-run plans, audit, and AWM.
  test-safety:
    name: Safety-Critical Suites (Zero Tolerance)
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install BATS
        run: |
          git clone https://github.com/bats-core/bats-core.git tests/bats
          git clone https://github.com/bats-core/bats-support.git tests/bats-support
          git clone https://github.com/bats-core/bats-assert.git tests/bats-assert
          git clone https://github.com/bats-core/bats-file.git tests/bats-file

      - name: Run safety-critical suites
        timeout-minutes: 15
        run: |
          ./tests/bats/bin/bats --formatter tap \
            --print-output-on-failure \
            tests/agent_safety.bats \
            tests/security_gate.bats \
            tests/validation.bats \
            tests/confirm.bats \
            tests/dryrun.bats \
            tests/atomic.bats \
            tests/unit/audit.bats \
            tests/unit/awm.bats \
            tests/unit/awm_v2.bats

  test-linux:
    name: Linux Bats Matrix
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Bash version
        run: bash --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq csvkit xmlstarlet parallel curl

      - name: Install BATS
        run: |
          git clone https://github.com/bats-core/bats-core.git tests/bats
          git clone https://github.com/bats-core/bats-support.git tests/bats-support
          git clone https://github.com/bats-core/bats-assert.git tests/bats-assert
          git clone https://github.com/bats-core/bats-file.git tests/bats-file

      - name: Run full Bats matrix
        timeout-minutes: 90
        run: |
          set -o pipefail
          ./tests/run_bats_suite.sh --scope all --formatter tap 2>&1 | tee results.tap

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-bats-results
          path: results.tap

  test-macos:
    name: macOS Bats Matrix
    runs-on: macos-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install jq bash coreutils parallel csvkit xmlstarlet

      - name: Install BATS
        run: |
          git clone https://github.com/bats-core/bats-core.git tests/bats
          git clone https://github.com/bats-core/bats-support.git tests/bats-support
          git clone https://github.com/bats-core/bats-assert.git tests/bats-assert
          git clone https://github.com/bats-core/bats-file.git tests/bats-file

      - name: Run full Bats matrix
        timeout-minutes: 90
        run: |
          set -o pipefail
          export BATS_TEST_SHELL="$(brew --prefix bash)/bin/bash"
          ./tests/run_bats_suite.sh --scope all --formatter tap 2>&1 | tee macos-results.tap

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-bats-results
          path: macos-results.tap

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test-safety, test-linux, test-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for version bump
        id: version
        run: |
          CURRENT_VERSION=$(grep -m1 'BASHER_VERSION=' lib/common.sh | cut -d'"' -f2)
          PREVIOUS_VERSION=$(git show HEAD~1:lib/common.sh | grep -m1 'BASHER_VERSION=' | cut -d'"' -f2 || echo "0.0.0")
          if [[ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]]; then
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate SBOM and checksums
        if: steps.version.outputs.changed == 'true'
        run: bash scripts/generate-sbom.sh

      - name: Create Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            SHA256SUMS
            sbom.json
