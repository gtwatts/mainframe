name: Tests

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  TERM: xterm-256color
  NO_COLOR: 1
  BATS_CORE_COMMIT: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5 # v1.14.0
  BATS_SUPPORT_COMMIT: 24a72e14349690bcbf7c151b9d2d1cdd32d36eb1 # v0.3.0
  BATS_ASSERT_COMMIT: f1e9280eaae8f86cbe278a687e6ba755bc802c1a # v2.2.4
  BATS_FILE_COMMIT: 13ad5e2ffcc360281432db3d43a306f7b3667d60 # v0.4.0

permissions: read-all

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on libraries
        run: |
          # Debug: Show shellcheck version
          shellcheck --version
          # Exclude expected warnings for library code:
          # SC1090: Non-constant source (lazy loading engine uses dynamic paths)
          # SC1091: Can't follow source (CI doesn't have files in expected paths)
          # SC2034: Variables unused (exported for library users)
          # RATCHET LEDGER (2026-07-21, hits remaining): SC2034=209 SC2178=31
          # SC2206=21 SC2128=19. An exclusion may be removed when its count
          # reaches 0. common.sh SC2206 is now clean (read -a splitting).
          # SC2178: Nameref false positive
          # SC2053: Intentional glob patterns
          # SC2206: Intentional word splitting for arrays
          # SC2059: Intentional variable in printf for ANSI codes
          # SC1003: Backslash character, not escape
          # SC2004: Style - $/{} in arithmetic
          # SC2181: Style - $? check
          # SC2012: ls vs find (intentional)
          # SC2120/SC2119: Function args (library functions)
          # SC2016: Single quotes intentional
          # SC2155: Declare and assign
          # SC2188: Redirect for truncation
          # SC2295: Pattern matching intentional
          # SC2015: A && B || C pattern (intentional)
          # SC2030/SC2031: Variable modification in subshell (intentional)
          # SC2317: Unreachable code false positive (library functions)
          # SC2069: Intentional redirect order for capture_stderr
          # SC1130: False positive for function names using reserved words with :: (then::do)
          # SC2294: eval "$@" intentional for fluent DSL action execution
          # SC2128: False positive for scalar variables named like arrays
          # SC2319: $? after condition (intentional pattern)
          # SC2094: False positive about reading/writing same file in pipeline
          # SC1078: Regex pattern with quotes
          # SC2179: String used as array (intentional associative array patterns)
          # SC1079: Quote issues in regex patterns (intentional)
          # SC2027: Quote issues in regex patterns (intentional)
          # SC2254: Unquoted case patterns (intentional for glob matching)
          # SC1083: Literal braces (intentional for git refs like @{u})
          # SC2093: Exec redirect patterns (intentional)
          # SC1072: Parse edge cases (intentional complex patterns)
          # SC1073: Parse edge cases (intentional complex patterns)
          # SC2183: Printf format edge cases (intentional)
          # SC2221: Unreachable case patterns (intentional for regex pattern matching)
          # SC2222: Unreachable case patterns (intentional for regex pattern matching)
          # SC2076: Quoted RHS of =~ intentional for literal matching in space-delimited lists
          # SC2001: sed is appropriate for complex regex replacements
          shellcheck -x \
            -e SC1090 -e SC1091 -e SC2034 -e SC2178 -e SC2053 -e SC2206 \
            -e SC2059 -e SC1003 -e SC2004 -e SC2181 -e SC2012 \
            -e SC2120 -e SC2119 -e SC2016 -e SC2155 -e SC2188 \
            -e SC2295 -e SC2015 -e SC2030 -e SC2031 -e SC2317 -e SC2069 \
            -e SC1130 -e SC2294 -e SC2128 -e SC2319 -e SC2094 -e SC1078 \
            -e SC2179 -e SC1079 -e SC2027 -e SC2254 -e SC1083 -e SC2093 \
            -e SC1072 -e SC1073 -e SC2183 -e SC2221 -e SC2222 -e SC2076 \
            -e SC2001 \
            lib/*.sh 2>&1 | tee /tmp/shellcheck_output.txt || {
              echo "=== ShellCheck Errors ==="
              cat /tmp/shellcheck_output.txt
              exit 1
            }

      - name: Check function export policy
        run: python3 scripts/check-function-exports.py --check

      - name: Run ShellCheck on scripts
        run: |
          # Exclude expected warnings for script code:
          # SC1090: Can't follow non-constant source
          # SC2034: Variables unused (exported for users)
          # SC2064: Use single quotes (intentional variable expansion in trap)
          # SC2009: Consider pgrep (ps is more portable)
          # SC2155: Declare and assign separately
          # SC2016: Expressions don't expand in single quotes (intentional)
          # SC2086: Double quote (intentional word splitting)
          # SC2053: Intentional glob pattern matching
          # SC2012: ls vs find (intentional)
          # SC2295: Pattern matching intentional
          # SC2178: Nameref false positive
          # SC2128: Array expansion intentional
          # SC2317: Unreachable code false positive (trap-invoked functions)
          # SC2329: Function never invoked (trap-invoked functions)
          # SC1003: Single quote escaping style
          # SC2119/SC2120: usage() pattern with optional args
          find scripts -name '*.sh' -type f | xargs shellcheck -x \
            -e SC1090 -e SC2034 -e SC2064 -e SC2009 -e SC2155 \
            -e SC2016 -e SC2086 -e SC2053 -e SC2012 -e SC2295 \
            -e SC2178 -e SC2128 -e SC2317 -e SC2329 -e SC1003 \
            -e SC2119 -e SC2120

      - name: Run ShellCheck on release entrypoints
        run: |
          shellcheck -x -e SC1091 -e SC2207 \
            get-mainframe.sh \
            bin/mainframe

      - name: Run ShellCheck on hooks
        run: |
          # Exclude expected warnings for hook code:
          # SC1090: Can't follow non-constant source
          # SC2034: Variables unused (exported for users)
          # SC2053: Intentional glob pattern matching in [[ ]]
          # SC2155: Declare and assign separately
          find hooks -name '*.sh' -type f | xargs shellcheck -x \
            -e SC1090 -e SC2034 -e SC2053 -e SC2155

      - name: Version and registry drift check
        run: |
          # VERSION is the single source of truth; lib/common.sh, the
          # registry generator, and FUNCTIONS.json must all agree.
          # FUNCTIONS.json must also match a fresh generation from lib/*.sh.
          bash scripts/sync-version.sh --check

      - name: Validate release tooling
        run: |
          bash -n scripts/dev/release.sh
          test "$(bash scripts/dev/release.sh --version)" = "$(tr -d '[:space:]' < VERSION)"

  # Time-sensitive claims gate promotion, not independent correctness work.
  release-readiness:
    name: Release claim and artifact readiness
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Receipt subjects bind to the PR head, not GitHub's synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Install fixed verifier dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep
          git clone --no-checkout --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git tests/bats
          git -C tests/bats checkout --detach "$BATS_CORE_COMMIT"
          test "$(git -C tests/bats rev-parse HEAD)" = "$BATS_CORE_COMMIT"
          sudo tests/bats/install.sh /usr/local

      - name: Verify public claims and committed release artifacts
        run: |
          bash scripts/verify-public-claims.sh
          bash scripts/dev/release.sh --check

      - name: Verify live receipt and public claim integration
        run: bats --filter-tags release-readiness tests/control_plane_claim.bats

  # Trust-plane gates (A++ Phase 0/1): manifest integrity, owner parity,
  # activation contract, archive reproducibility, MCP authorization.
  trust-gates:
    name: Trust-Plane Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl ripgrep zsh

      - name: Set up integrity-pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          checksum: aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967
          enable-cache: false

      - name: Install BATS
        run: |
          git clone --no-checkout --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git tests/bats
          git clone --no-checkout --depth 1 --branch v0.3.0 https://github.com/bats-core/bats-support.git tests/bats-support
          git clone --no-checkout --depth 1 --branch v2.2.4 https://github.com/bats-core/bats-assert.git tests/bats-assert
          git -C tests/bats checkout --detach "$BATS_CORE_COMMIT"
          git -C tests/bats-support checkout --detach "$BATS_SUPPORT_COMMIT"
          git -C tests/bats-assert checkout --detach "$BATS_ASSERT_COMMIT"
          test "$(git -C tests/bats rev-parse HEAD)" = "$BATS_CORE_COMMIT"
          test "$(git -C tests/bats-support rev-parse HEAD)" = "$BATS_SUPPORT_COMMIT"
          test "$(git -C tests/bats-assert rev-parse HEAD)" = "$BATS_ASSERT_COMMIT"

      - name: Manifest regenerates registry byte-identically
        run: python3 scripts/generate-manifest.py --verify

      - name: Owner parity — zero disagreements on all surfaces
        timeout-minutes: 10
        run: python3 scripts/check-owner-parity.py

      - name: Activation + parity + rollback bats gates
        timeout-minutes: 15
        run: |
          ./tests/bats/bin/bats --formatter tap --print-output-on-failure \
            tests/owner-parity.bats \
            tests/awm_project.bats \
            tests/durable_project_memory_route.bats \
            tests/activate.bats \
            tests/activate_enforce.bats \
            tests/activation-awm.bats \
            tests/rollback.bats

      - name: Verified agent session + clean-host lifecycle gates
        timeout-minutes: 30
        run: |
          ./tests/bats/bin/bats --formatter tap --print-output-on-failure \
            tests/agent_gateway.bats \
            tests/agent_impact_harness.bats \
            tests/agent_impact_local.bats \
            tests/cli_bash_bootstrap.bats \
            tests/doctor.bats \
            tests/onboard.bats \
            tests/protect_status.bats \
            tests/shell_onboarding_certification.bats \
            tests/bootstrap-release.bats \
            tests/upgrade-release.bats \
            tests/release-upgrade-lifecycle.bats \
            tests/homebrew-formula.bats \
            tests/install_lifecycle.bats \
            tests/host_runtime.bats \
            tests/host_lifecycle.bats \
            tests/host_acquisition.bats \
            tests/native_host_certification.bats \
            tests/release-archive.bats \
            tests/release_evidence.bats \
            tests/release_evidence_workflow.bats \
            tests/runner_platform.bats \
            tests/unit/installer.bats

      - name: MCP negative authorization suite
        run: |
          cd mcp && uv run --locked --group dev python -m pytest tests/ -q

      - name: Archive build is reproducible
        run: bash scripts/build-release-archive.sh --verify

  # Safety-critical suites run with ZERO tolerance on both platforms.
  # These cover the agent execution safety stack (agent_safety), the
  # destructive-command gate (security_gate), path validation, atomic
  # writes, confirmation flows, dry-run plans, audit, and AWM.
  test-safety:
    name: Safety-Critical Suites (Zero Tolerance)
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Install BATS
        run: |
          git clone --no-checkout --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git tests/bats
          git clone --no-checkout --depth 1 --branch v0.3.0 https://github.com/bats-core/bats-support.git tests/bats-support
          git clone --no-checkout --depth 1 --branch v2.2.4 https://github.com/bats-core/bats-assert.git tests/bats-assert
          git clone --no-checkout --depth 1 --branch v0.4.0 https://github.com/bats-core/bats-file.git tests/bats-file
          git -C tests/bats checkout --detach "$BATS_CORE_COMMIT"
          git -C tests/bats-support checkout --detach "$BATS_SUPPORT_COMMIT"
          git -C tests/bats-assert checkout --detach "$BATS_ASSERT_COMMIT"
          git -C tests/bats-file checkout --detach "$BATS_FILE_COMMIT"
          test "$(git -C tests/bats rev-parse HEAD)" = "$BATS_CORE_COMMIT"
          test "$(git -C tests/bats-support rev-parse HEAD)" = "$BATS_SUPPORT_COMMIT"
          test "$(git -C tests/bats-assert rev-parse HEAD)" = "$BATS_ASSERT_COMMIT"
          test "$(git -C tests/bats-file rev-parse HEAD)" = "$BATS_FILE_COMMIT"

      - name: Set up Python 3.9 for local agent-impact smoke
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'

      - name: Install bash 5 (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install bash

      - name: Run safety-critical suites
        timeout-minutes: 30
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            export BATS_TEST_SHELL="$(brew --prefix bash)/bin/bash"
          fi
          ./tests/bats/bin/bats --formatter tap \
            --print-output-on-failure \
            tests/agent_impact_local.bats \
            tests/agent_impact_runtime_preflight.bats \
            tests/agent_safety.bats \
            tests/agent_safety_regressions.bats \
            tests/security_gate.bats \
            tests/agent_gateway.bats \
            tests/validation.bats \
            tests/confirm.bats \
            tests/dryrun.bats \
            tests/atomic.bats \
            tests/unit/audit.bats \
            tests/unit/awm.bats \
            tests/unit/awm_v2.bats

  test-linux:
    name: Linux Bats Matrix
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Check Bash version
        run: bash --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq csvkit xmlstarlet parallel curl ripgrep zsh

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          checksum: aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967
          enable-cache: false

      - name: Install BATS
        run: |
          git clone --no-checkout --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git tests/bats
          git clone --no-checkout --depth 1 --branch v0.3.0 https://github.com/bats-core/bats-support.git tests/bats-support
          git clone --no-checkout --depth 1 --branch v2.2.4 https://github.com/bats-core/bats-assert.git tests/bats-assert
          git clone --no-checkout --depth 1 --branch v0.4.0 https://github.com/bats-core/bats-file.git tests/bats-file
          git -C tests/bats checkout --detach "$BATS_CORE_COMMIT"
          git -C tests/bats-support checkout --detach "$BATS_SUPPORT_COMMIT"
          git -C tests/bats-assert checkout --detach "$BATS_ASSERT_COMMIT"
          git -C tests/bats-file checkout --detach "$BATS_FILE_COMMIT"
          test "$(git -C tests/bats rev-parse HEAD)" = "$BATS_CORE_COMMIT"
          test "$(git -C tests/bats-support rev-parse HEAD)" = "$BATS_SUPPORT_COMMIT"
          test "$(git -C tests/bats-assert rev-parse HEAD)" = "$BATS_ASSERT_COMMIT"
          test "$(git -C tests/bats-file rev-parse HEAD)" = "$BATS_FILE_COMMIT"

      - name: Run correctness Bats matrix
        timeout-minutes: 180
        run: |
          set -o pipefail
          ./tests/run_bats_suite.sh --scope correctness --formatter tap 2>&1 | tee results.tap

      - name: Build canonical release digest
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          bash scripts/generate-sbom.sh
          bash scripts/build-release-archive.sh
          awk '{print $1}' "dist/mainframe-$(tr -d '[:space:]' < VERSION).tar.gz.sha256" \
            > release-archive.sha256

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-bats-results
          path: |
            results.tap
            release-archive.sha256

  bash-44-compat:
    name: Bash 4.4 compatibility
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 210
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Install test and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq csvkit xmlstarlet parallel curl ripgrep zsh build-essential

      - name: Build integrity-pinned Bash 4.4.0
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bash-4.4.tar.gz"
          prefix="$RUNNER_TEMP/bash-4.4-prefix"
          reviewed_bash=/usr/local/bin/bash
          test ! -e "$reviewed_bash" && test ! -L "$reviewed_bash"
          curl --proto '=https' --tlsv1.2 -fsSLo "$archive" \
            https://ftp.gnu.org/gnu/bash/bash-4.4.tar.gz
          printf '%s  %s\n' \
            d86b3392c1202e8ff5a423b302e6284db7f8f435ea9f39b5b1b20fd3ac36dfcb \
            "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          (
            cd "$RUNNER_TEMP/bash-4.4"
            ./configure --prefix="$prefix" --without-bash-malloc
            make -j"$(nproc)"
            make install
          )
          sudo /usr/bin/install -o root -g root -m 0755 \
            "$prefix/bin/bash" "$reviewed_bash"
          cmp -s "$prefix/bin/bash" "$reviewed_bash"
          test "$(stat -c '%a' "$reviewed_bash")" = 755
          bash44="$reviewed_bash"
          test "$("$bash44" -c 'printf "%s" "$BASH_VERSION"')" = \
            '4.4.0(1)-release'
          printf 'MAINFRAME_BASH=%s\nBATS_TEST_SHELL=%s\n' \
            "$bash44" "$bash44" >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$reviewed_bash")" >> "$GITHUB_PATH"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          checksum: aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967
          enable-cache: false

      - name: Install BATS
        run: |
          git clone --no-checkout --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git tests/bats
          git clone --no-checkout --depth 1 --branch v0.3.0 https://github.com/bats-core/bats-support.git tests/bats-support
          git clone --no-checkout --depth 1 --branch v2.2.4 https://github.com/bats-core/bats-assert.git tests/bats-assert
          git clone --no-checkout --depth 1 --branch v0.4.0 https://github.com/bats-core/bats-file.git tests/bats-file
          git -C tests/bats checkout --detach "$BATS_CORE_COMMIT"
          git -C tests/bats-support checkout --detach "$BATS_SUPPORT_COMMIT"
          git -C tests/bats-assert checkout --detach "$BATS_ASSERT_COMMIT"
          git -C tests/bats-file checkout --detach "$BATS_FILE_COMMIT"
          test "$(git -C tests/bats rev-parse HEAD)" = "$BATS_CORE_COMMIT"
          test "$(git -C tests/bats-support rev-parse HEAD)" = "$BATS_SUPPORT_COMMIT"
          test "$(git -C tests/bats-assert rev-parse HEAD)" = "$BATS_ASSERT_COMMIT"
          test "$(git -C tests/bats-file rev-parse HEAD)" = "$BATS_FILE_COMMIT"

      - name: Run correctness Bats matrix under Bash 4.4
        timeout-minutes: 180
        run: |
          set -o pipefail
          test "$("$MAINFRAME_BASH" -c 'printf "%s" "$BASH_VERSION"')" = \
            '4.4.0(1)-release'
          "$MAINFRAME_BASH" ./tests/run_bats_suite.sh \
            --scope correctness --formatter tap 2>&1 | tee bash-44-results.tap

      - name: Build canonical archive under Bash 4.4
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          "$MAINFRAME_BASH" scripts/generate-sbom.sh
          "$MAINFRAME_BASH" scripts/build-release-archive.sh --verify
          "$MAINFRAME_BASH" scripts/build-release-archive.sh

  test-macos:
    name: macOS Bats Matrix
    runs-on: macos-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install jq bash coreutils parallel csvkit xmlstarlet ripgrep

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          checksum: ed336d0ba49db8ef89b2b41fffa372ce63bd032f22a56f001c265891aec32829
          enable-cache: false

      - name: Install BATS
        run: |
          git clone --no-checkout --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git tests/bats
          git clone --no-checkout --depth 1 --branch v0.3.0 https://github.com/bats-core/bats-support.git tests/bats-support
          git clone --no-checkout --depth 1 --branch v2.2.4 https://github.com/bats-core/bats-assert.git tests/bats-assert
          git clone --no-checkout --depth 1 --branch v0.4.0 https://github.com/bats-core/bats-file.git tests/bats-file
          git -C tests/bats checkout --detach "$BATS_CORE_COMMIT"
          git -C tests/bats-support checkout --detach "$BATS_SUPPORT_COMMIT"
          git -C tests/bats-assert checkout --detach "$BATS_ASSERT_COMMIT"
          git -C tests/bats-file checkout --detach "$BATS_FILE_COMMIT"
          test "$(git -C tests/bats rev-parse HEAD)" = "$BATS_CORE_COMMIT"
          test "$(git -C tests/bats-support rev-parse HEAD)" = "$BATS_SUPPORT_COMMIT"
          test "$(git -C tests/bats-assert rev-parse HEAD)" = "$BATS_ASSERT_COMMIT"
          test "$(git -C tests/bats-file rev-parse HEAD)" = "$BATS_FILE_COMMIT"

      - name: Run correctness Bats matrix
        timeout-minutes: 180
        run: |
          set -o pipefail
          export BATS_TEST_SHELL="$(brew --prefix bash)/bin/bash"
          ./tests/run_bats_suite.sh --scope correctness --formatter tap 2>&1 | tee macos-results.tap

      - name: Build canonical release digest
        run: |
          export MAINFRAME_BASH="$(brew --prefix bash)/bin/bash"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          "$MAINFRAME_BASH" scripts/generate-sbom.sh
          "$MAINFRAME_BASH" scripts/build-release-archive.sh
          awk '{print $1}' "dist/mainframe-$(tr -d '[:space:]' < VERSION).tar.gz.sha256" \
            > release-archive.sha256

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: macos-bats-results
          path: |
            macos-results.tap
            release-archive.sha256

  pi-compatibility:
    name: Pi exact candidate (${{ matrix.pi.id }}, ${{ matrix.target.id }})
    runs-on: ${{ matrix.target.runner }}
    needs: lint
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: Linux-x86_64-glibc
            runner: ubuntu-24.04
            os: Linux
            arch: x86_64
            system_libc: glibc
          - id: Darwin-arm64-none
            runner: macos-15
            os: Darwin
            arch: arm64
            system_libc: none
          - id: Darwin-x86_64-none
            runner: macos-15-intel
            os: Darwin
            arch: x86_64
            system_libc: none
        pi:
          # Upstream 0.73.1 emits user_bash in TUI mode but not for RPC's
          # client-side bash command; the common loader test exercises its hook.
          - id: upstream-0.73.1
            package: '@mariozechner/pi-coding-agent'
            version: '0.73.1'
            integrity: 'sha512-gXQh3SaZmWTfVMc4Ao5+LGbVeKvzyO7tolok0nLsZgq9nGjZx/EEU3NM8C+qUnB4Nvs2rswG5qOVgLzQkq0fHQ=='
            rpc_user_bash: '0'
          - id: fork-0.84.2
            package: '@earendil-works/pi-coding-agent'
            version: '0.84.2'
            integrity: 'sha512-l4E+B7hgXKWddRo8bC/eSue2aWZjEgJ9xIpf5p0Og+lq8a2TArCwJ0HCoCPCgaBP/tN4zbYH/wOwvx9pJpeLCA=='
            rpc_user_bash: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: recursive

      - name: Set up pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.2'

      - name: Harden native Node.js executable
        run: |
          set -euo pipefail
          node_bin="$(python3 -c 'import os, shutil; print(os.path.realpath(shutil.which("node")))')"
          test -f "$node_bin"
          test -x "$node_bin"
          staged_node_root="${RUNNER_TEMP}/mainframe-native-node"
          staged_node_dir="$staged_node_root/bin"
          [[ ! -e "$staged_node_root" && ! -L "$staged_node_root" ]]
          mkdir -m 0700 "$staged_node_root"
          mkdir -m 0700 "$staged_node_dir"
          staged_node_dir="$(cd "$staged_node_dir" && pwd -P)"
          /usr/bin/install -m 0755 "$node_bin" "$staged_node_dir/node"
          cmp -s "$node_bin" "$staged_node_dir/node"
          printf '%s\n' "$staged_node_dir" >> "$GITHUB_PATH"

      - name: Install runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep zsh

      - name: Install runtime dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bash jq ripgrep

      - name: Assert native candidate platform
        run: |
          set -euo pipefail
          mainframe_bash="$(command -v bash)"
          if [[ "$RUNNER_OS" == macOS ]]; then
            mainframe_bash="$(brew --prefix bash)/bin/bash"
          fi
          "$mainframe_bash" scripts/dev/native-host/assert-runner-platform.sh \
            '${{ matrix.target.id }}' \
            '${{ matrix.target.os }}' \
            '${{ matrix.target.arch }}' \
            '${{ matrix.target.system_libc }}'

      - name: Bind native Node.js executable before Pi tests
        id: node_runtime_binding
        run: |
          set -euo pipefail
          node_command="$(command -v node)"
          node_bin="$(python3 - "$node_command" <<'PY'
          import os
          import sys
          print(os.path.realpath(sys.argv[1]))
          PY
          )"
          test -x "$node_bin"
          suffix="${{ matrix.pi.id }}-${{ matrix.target.id }}"
          node_binding="$RUNNER_TEMP/pi-node-pre-${suffix}.json"
          clean_python=(
            /usr/bin/env -i
            PATH=/usr/bin:/bin
            LANG=C
            LC_ALL=C
            /usr/bin/python3
          )
          "${clean_python[@]}" .github/scripts/build-pi-cell-evidence.py snapshot-node \
            --repo-root "$GITHUB_WORKSPACE" \
            --node-executable "$node_bin" \
            --expected-os '${{ matrix.target.os }}' \
            --expected-arch '${{ matrix.target.arch }}' \
            --output "$node_binding"
          if [[ "$RUNNER_OS" == macOS ]]; then
            test "$(stat -f '%Lp' "$node_binding")" = 600
          else
            test "$(stat -c '%a' "$node_binding")" = 600
          fi
          node_binding_sha="$(python3 - "$node_binding" <<'PY'
          import hashlib
          import pathlib
          import sys
          print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )"
          [[ "$node_binding_sha" =~ ^[0-9a-f]{64}$ ]]
          expected_node_process_arch=arm64
          if [[ '${{ matrix.target.arch }}' == x86_64 ]]; then
            expected_node_process_arch=x64
          fi
          test "$("$node_bin" -p 'process.arch')" = "$expected_node_process_arch"
          printf 'node_bin=%s\n' "$node_bin" >> "$GITHUB_OUTPUT"
          printf 'node_binding_sha256=%s\n' "$node_binding_sha" >> "$GITHUB_OUTPUT"

      - name: Install integrity-pinned BATS
        run: |
          git clone --no-checkout --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git tests/bats
          git -C tests/bats checkout --detach "$BATS_CORE_COMMIT"
          test "$(git -C tests/bats rev-parse HEAD)" = "$BATS_CORE_COMMIT"

      - name: Install pinned Pi package with lifecycle scripts disabled
        id: pi_runtime_snapshot
        env:
          PI_PACKAGE: ${{ matrix.pi.package }}
          PI_VERSION: ${{ matrix.pi.version }}
          PI_INTEGRITY: ${{ matrix.pi.integrity }}
        run: |
          set -euo pipefail
          pi_prefix="$RUNNER_TEMP/pi-prefix"
          npm_home="$RUNNER_TEMP/pi-npm-home"
          npm_cache="$RUNNER_TEMP/pi-npm-cache"
          for directory in "$pi_prefix" "$npm_home" "$npm_cache"; do
            if [[ -e "$directory" || -L "$directory" ]]; then
              echo "ERROR: fixed Pi installation path already exists: $directory" >&2
              exit 1
            fi
          done
          mkdir -p "$pi_prefix" "$npm_home" "$npm_cache"
          actual_integrity="$(
            HOME="$npm_home" \
            npm_config_cache="$npm_cache" \
            npm_config_userconfig=/dev/null \
            npm view "$PI_PACKAGE@$PI_VERSION" dist.integrity
          )"
          test "$actual_integrity" = "$PI_INTEGRITY"
          integrity_file="$RUNNER_TEMP/pi-npm-integrity-${{ matrix.pi.id }}-${{ matrix.target.id }}.txt"
          printf '%s\n' "$actual_integrity" > "$integrity_file"
          HOME="$npm_home" \
          npm_config_cache="$npm_cache" \
          npm_config_userconfig=/dev/null \
          npm_config_ignore_scripts=true \
          npm_config_audit=false \
          npm_config_fund=false \
            npm install \
              --prefix "$pi_prefix" \
              --ignore-scripts \
              --no-audit \
              --no-fund \
              --package-lock=false \
              "$PI_PACKAGE@$PI_VERSION"
          pi_bin="$pi_prefix/node_modules/.bin/pi"
          test -x "$pi_bin"
          node -e '
            const manifest = require(process.argv[1]);
            if (manifest.name !== process.argv[2] || manifest.version !== process.argv[3]) process.exit(1);
          ' "$pi_prefix/node_modules/$PI_PACKAGE/package.json" "$PI_PACKAGE" "$PI_VERSION"
          suffix="${{ matrix.pi.id }}-${{ matrix.target.id }}"
          runtime_root="$RUNNER_TEMP/pi-prefix/node_modules"
          package_root="$runtime_root/$PI_PACKAGE"
          snapshot="$RUNNER_TEMP/pi-runtime-pre-${suffix}.json"
          clean_python=(
            /usr/bin/env -i
            PATH=/usr/bin:/bin
            LANG=C
            LC_ALL=C
            /usr/bin/python3
          )
          "${clean_python[@]}" .github/scripts/build-pi-cell-evidence.py snapshot-runtime \
            --pi-package-root "$package_root" \
            --pi-runtime-root "$runtime_root" \
            --pi-install-prefix "$pi_prefix" \
            --expected-package "$PI_PACKAGE" \
            --expected-version "$PI_VERSION" \
            --output "$snapshot"
          snapshot_sha="$(node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            process.stdout.write(crypto.createHash("sha256")
              .update(fs.readFileSync(process.argv[1])).digest("hex"));
          ' "$snapshot")"
          [[ "$snapshot_sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'snapshot_sha256=%s\n' "$snapshot_sha" >> "$GITHUB_OUTPUT"
          test "$("$pi_bin" --version 2>&1)" = "$PI_VERSION"

      - name: Build and extract exact Pi release candidate
        run: |
          set -euo pipefail
          mainframe_bash="$(command -v bash)"
          if [[ "$RUNNER_OS" == macOS ]]; then
            mainframe_bash="$(brew --prefix bash)/bin/bash"
          fi
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          "$mainframe_bash" scripts/generate-sbom.sh
          "$mainframe_bash" scripts/build-release-archive.sh --verify
          "$mainframe_bash" scripts/build-release-archive.sh

          version="$(tr -d '[:space:]' < VERSION)"
          archive="$GITHUB_WORKSPACE/dist/mainframe-${version}.tar.gz"
          checksum="${archive}.sha256"
          candidate="$RUNNER_TEMP/mainframe-pi-candidate"
          mkdir -p "$candidate/tests"
          (cd "$(dirname "$archive")" && shasum -a 256 -c "$(basename "$checksum")") 2>/dev/null || \
            (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$checksum")")
          tar -xzf "$archive" -C "$candidate"
          cp \
            tests/pi_integration.bats \
            tests/pi_install.bats \
            tests/pi_compatibility_manifest.bats \
            "$candidate/tests/"
          python3 \
            "$candidate/scripts/dev/native-host/hash-package-tree.py" \
            "$candidate" tests > \
            "$RUNNER_TEMP/pi-tests-${{ matrix.pi.id }}-${{ matrix.target.id }}.sha256"
          awk '{print $1}' "$checksum" > \
            "$RUNNER_TEMP/pi-candidate-${{ matrix.pi.id }}-${{ matrix.target.id }}.sha256"

      - name: Verify first-party Pi package, hooks, tools, and migration from exact candidate
        env:
          MAINFRAME_PI_RPC_USER_BASH: ${{ matrix.pi.rpc_user_bash }}
          MAINFRAME_PI_REQUIRE_BOTH_SHELLS: '1'
          PI_TELEMETRY: '0'
        run: |
          set -euo pipefail
          mainframe_bash="$(command -v bash)"
          if [[ "$RUNNER_OS" == macOS ]]; then
            mainframe_bash="$(brew --prefix bash)/bin/bash"
          fi
          runtime_root="$RUNNER_TEMP/pi-prefix/node_modules"
          package_root="$runtime_root/${{ matrix.pi.package }}"
          pi_bin="$runtime_root/.bin/pi"
          candidate_root="$RUNNER_TEMP/mainframe-pi-candidate"
          test -d "$runtime_root"
          test -d "$package_root"
          test -x "$pi_bin"
          test -d "$candidate_root"
          test -x /bin/bash
          test -x /bin/zsh
          export MAINFRAME_PI_BIN="$pi_bin"
          export MAINFRAME_PI_NODE_BIN='${{ steps.node_runtime_binding.outputs.node_bin }}'
          "$mainframe_bash" tests/bats/bin/bats \
            --formatter tap \
            --print-output-on-failure \
            tests/pi_workflow_contract.bats \
            tests/pi_evidence_receipt.bats \
            tests/pi_cell_evidence.bats
          "$mainframe_bash" tests/bats/bin/bats \
            --formatter tap \
            --print-output-on-failure \
            "$candidate_root/tests/pi_integration.bats" \
            "$candidate_root/tests/pi_install.bats" \
            "$candidate_root/tests/pi_compatibility_manifest.bats" \
            | tee "$RUNNER_TEMP/pi-candidate-${{ matrix.pi.id }}-${{ matrix.target.id }}.tap"
          test "$(python3 \
            "$candidate_root/scripts/dev/native-host/hash-package-tree.py" \
            "$candidate_root" tests)" = \
            "$(tr -d '[:space:]' < \
              "$RUNNER_TEMP/pi-tests-${{ matrix.pi.id }}-${{ matrix.target.id }}.sha256")"

      - name: Bind observed Pi cell identity to exact candidate evidence
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/pi-prefix/node_modules"
          package_root="$runtime_root/${{ matrix.pi.package }}"
          integrity_file="$RUNNER_TEMP/pi-npm-integrity-${{ matrix.pi.id }}-${{ matrix.target.id }}.txt"
          pre_test_snapshot="$RUNNER_TEMP/pi-runtime-pre-${{ matrix.pi.id }}-${{ matrix.target.id }}.json"
          pre_test_snapshot_sha='${{ steps.pi_runtime_snapshot.outputs.snapshot_sha256 }}'
          node_bin='${{ steps.node_runtime_binding.outputs.node_bin }}'
          pre_test_node_binding="$RUNNER_TEMP/pi-node-pre-${{ matrix.pi.id }}-${{ matrix.target.id }}.json"
          pre_test_node_binding_sha='${{ steps.node_runtime_binding.outputs.node_binding_sha256 }}'
          test -d "$package_root"
          test -d "$runtime_root"
          test -f "$integrity_file"
          test -f "$pre_test_snapshot"
          [[ "$pre_test_snapshot_sha" =~ ^[0-9a-f]{64}$ ]]
          test -x "$node_bin"
          test -f "$pre_test_node_binding"
          [[ "$pre_test_node_binding_sha" =~ ^[0-9a-f]{64}$ ]]
          if ! git show-ref --verify --quiet "$GITHUB_REF"; then
            git update-ref "$GITHUB_REF" "$GITHUB_SHA"
          fi
          source_ref_sha="$(git rev-parse "$GITHUB_REF")"
          source_commit_sha="$(git rev-parse "$GITHUB_REF^{commit}")"
          test "$source_commit_sha" = "$(git rev-parse HEAD)"
          version="$(tr -d '[:space:]' < VERSION)"
          suffix="${{ matrix.pi.id }}-${{ matrix.target.id }}"
          archive="$GITHUB_WORKSPACE/dist/mainframe-${version}.tar.gz"
          archive_binding="$RUNNER_TEMP/pi-candidate-${suffix}.sha256"
          test_binding="$RUNNER_TEMP/pi-tests-${suffix}.sha256"
          tap="$RUNNER_TEMP/pi-candidate-${suffix}.tap"
          cell="$RUNNER_TEMP/pi-cell-${suffix}.json"
          clean_python=(
            /usr/bin/env -i
            PATH=/usr/bin:/bin
            LANG=C
            LC_ALL=C
            /usr/bin/python3
          )
          cell_common=(
            --contract .github/pi-evidence-contract.json
            --schema .github/schemas/pi-cell-evidence.schema.json
            --repo-root "$GITHUB_WORKSPACE"
            --archive "$archive"
            --pi-package-root "$package_root"
            --pi-runtime-root "$runtime_root"
            --pi-install-prefix "$RUNNER_TEMP/pi-prefix"
            --pre-test-runtime-snapshot "$pre_test_snapshot"
            --pre-test-runtime-snapshot-sha256 "$pre_test_snapshot_sha"
            --node-executable "$node_bin"
            --expected-node-arch '${{ matrix.target.arch }}'
            --pre-test-node-binding "$pre_test_node_binding"
            --pre-test-node-binding-sha256 "$pre_test_node_binding_sha"
            --npm-integrity-file "$integrity_file"
            --archive-binding "$archive_binding"
            --test-binding "$test_binding"
            --tap "$tap"
            --repository "$GITHUB_REPOSITORY"
            --version "$version"
            --source-ref "$GITHUB_REF"
            --source-ref-sha "$source_ref_sha"
            --source-commit-sha "$source_commit_sha"
            --workflow-run-id "$GITHUB_RUN_ID"
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
          )
          "${clean_python[@]}" .github/scripts/build-pi-cell-evidence.py create \
            "${cell_common[@]}" --output "$cell"
          "${clean_python[@]}" scripts/dev/native-host/validate-evidence.py \
            .github/schemas/pi-cell-evidence.schema.json "$cell"
          "${clean_python[@]}" .github/scripts/build-pi-cell-evidence.py verify \
            "${cell_common[@]}" --evidence "$cell"
          test "$(jq -er '.host.observation_mode' "$cell")" = native
          test "$(jq -er '.cell_id' "$cell")" = \
            "${{ matrix.pi.id }}@${{ matrix.target.id }}"
          test "$(jq -er '.node_runtime.pre_test.observed_process_arch' "$cell")" = \
            '${{ matrix.target.arch }}'
          jq -e '
            .node_runtime.pre_test == .node_runtime.post_test and
            (.node_runtime.pre_test.executable | has("path") | not)
          ' "$cell" >/dev/null

      - name: Upload exact-candidate Pi evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-candidate-${{ matrix.pi.id }}-${{ matrix.target.id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/pi-candidate-${{ matrix.pi.id }}-${{ matrix.target.id }}.tap
            ${{ runner.temp }}/pi-candidate-${{ matrix.pi.id }}-${{ matrix.target.id }}.sha256
            ${{ runner.temp }}/pi-tests-${{ matrix.pi.id }}-${{ matrix.target.id }}.sha256
            ${{ runner.temp }}/pi-cell-${{ matrix.pi.id }}-${{ matrix.target.id }}.json
            ${{ runner.temp }}/pi-node-pre-${{ matrix.pi.id }}-${{ matrix.target.id }}.json
            ${{ runner.temp }}/pi-runtime-pre-${{ matrix.pi.id }}-${{ matrix.target.id }}.json

  # Establish release-tag identity without signing authority. Every OIDC job
  # depends on this clean gate, so a moved, mismatched, or non-main tag cannot
  # receive an attestation before the release job rejects it.
  release-tag-identity:
    name: Validate release tag identity
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag_ref_sha: ${{ steps.identity.outputs.tag_ref_sha }}
      tag_commit: ${{ steps.identity.outputs.tag_commit }}
    steps:
      - name: Checkout tag without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact new tag on main
        id: identity
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF" = "refs/tags/v$version"
          test "$GITHUB_REF_NAME" = "v$version"
          test "${{ github.event.created }}" = true
          tag_ref_sha="$(git rev-parse "$GITHUB_REF")"
          tag_commit="$(git rev-parse "$GITHUB_REF^{commit}")"
          test "$tag_ref_sha" = "${{ github.event.after }}"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          git fetch --force origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_ref_sha=$tag_ref_sha" >> "$GITHUB_OUTPUT"
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"

  pi-cell-attestation:
    name: Validate and attest exact Pi cell evidence
    runs-on: ubuntu-24.04
    needs: [pi-compatibility, release-tag-identity, release-readiness]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted evidence validators
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all exact-candidate Pi evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pi-candidate-*
          path: gate-evidence/pi
          merge-multiple: true

      - name: Strictly validate all Pi cell evidence before signing
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          test "$GITHUB_REF" = "$tag_ref"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$tag_ref^{commit}")"
          tag_ref_sha="$(git rev-parse "$tag_ref")"
          tag_commit="$(git rev-parse "$tag_ref^{commit}")"
          version="$(tr -d '[:space:]' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$tag_commit")"

          mapfile -t evidence_files < <(
            find gate-evidence/pi -mindepth 1 -maxdepth 1 -print | sort
          )
          test "${#evidence_files[@]}" -eq 36
          for evidence_file in "${evidence_files[@]}"; do
            test -f "$evidence_file"
            test ! -L "$evidence_file"
            test "$(stat -c '%h' "$evidence_file")" -eq 1
          done
          for pi_id in fork-0.84.2 upstream-0.73.1; do
            for target_id in \
              Darwin-arm64-none Darwin-x86_64-none Linux-x86_64-glibc; do
              suffix="${pi_id}-${target_id}"
              test -f "gate-evidence/pi/pi-candidate-${suffix}.sha256"
              test -f "gate-evidence/pi/pi-candidate-${suffix}.tap"
              test -f "gate-evidence/pi/pi-tests-${suffix}.sha256"
              test -f "gate-evidence/pi/pi-cell-${suffix}.json"
              test -f "gate-evidence/pi/pi-node-pre-${suffix}.json"
              test -f "gate-evidence/pi/pi-runtime-pre-${suffix}.json"
              test "$(jq -er '.cell_id' \
                "gate-evidence/pi/pi-cell-${suffix}.json")" = \
                "${pi_id}@${target_id}"
              expected_arch="${target_id#*-}"
              expected_arch="${expected_arch%%-*}"
              test "$(jq -er '.node_runtime.pre_test.observed_process_arch' \
                "gate-evidence/pi/pi-cell-${suffix}.json")" = "$expected_arch"
              jq -e '
                .node_runtime.pre_test == .node_runtime.post_test and
                (.node_runtime.pre_test.executable | has("path") | not)
              ' "gate-evidence/pi/pi-cell-${suffix}.json" >/dev/null
            done
          done

          bash scripts/generate-sbom.sh
          bash scripts/build-release-archive.sh --verify
          bash scripts/build-release-archive.sh
          archive="$GITHUB_WORKSPACE/dist/mainframe-${version}.tar.gz"
          validation_receipt="$RUNNER_TEMP/pi-signing-validation.json"
          test ! -e "$validation_receipt"
          clean_python=(
            /usr/bin/env -i
            PATH=/usr/bin:/bin
            LANG=C
            LC_ALL=C
            /usr/bin/python3
          )
          evidence_common=(
            --contract .github/pi-evidence-contract.json
            --schema .github/schemas/pi-release-evidence.schema.json
            --cell-schema .github/schemas/pi-cell-evidence.schema.json
            --repo-root "$GITHUB_WORKSPACE"
            --archive "$archive"
            --repository "$GITHUB_REPOSITORY"
            --version "$version"
            --tag "$GITHUB_REF_NAME"
            --tag-ref-sha "$tag_ref_sha"
            --tag-commit-sha "$tag_commit"
            --workflow-run-id "$GITHUB_RUN_ID"
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
          )
          "${clean_python[@]}" \
            .github/scripts/build-pi-release-evidence.py create \
            "${evidence_common[@]}" \
            --artifacts-dir gate-evidence/pi \
            --output "$validation_receipt"
          "${clean_python[@]}" \
            .github/scripts/build-pi-release-evidence.py verify \
            "${evidence_common[@]}" \
            --artifacts-dir gate-evidence/pi \
            --evidence "$validation_receipt"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg tag_ref_sha "$tag_ref_sha" \
            --arg tag_commit "$tag_commit" \
            --arg run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '
              .source == {
                repository: $repository,
                tag: $tag,
                tag_ref_sha: $tag_ref_sha,
                tag_commit_sha: $tag_commit,
                workflow_run_id: $run_id,
                workflow_run_attempt: $run_attempt
              } and
              ([.matrix[].id] == [
                "fork-0.84.2@Darwin-arm64-none",
                "fork-0.84.2@Darwin-x86_64-none",
                "fork-0.84.2@Linux-x86_64-glibc",
                "upstream-0.73.1@Darwin-arm64-none",
                "upstream-0.73.1@Darwin-x86_64-none",
                "upstream-0.73.1@Linux-x86_64-glibc"
              ]) and
              ([.matrix[].observation.mode] | all(. == "native")) and
              ([.matrix[].result.status] | all(. == "pass"))
            ' "$validation_receipt" >/dev/null

          for cell_receipt in gate-evidence/pi/pi-cell-*.json; do
            cell_name="${cell_receipt##*/}"
            signing_subject="$RUNNER_TEMP/$cell_name"
            test ! -e "$signing_subject"
            install -m 0644 "$cell_receipt" "$signing_subject"
            test "$(sha256sum "$signing_subject" | awk '{print $1}')" = \
              "$(sha256sum "$cell_receipt" | awk '{print $1}')"
          done

      - name: Attest fork 0.84.2 Darwin arm64 Pi cell
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/pi-cell-fork-0.84.2-Darwin-arm64-none.json

      - name: Attest fork 0.84.2 Darwin x86_64 Pi cell
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/pi-cell-fork-0.84.2-Darwin-x86_64-none.json

      - name: Attest fork 0.84.2 Linux x86_64 glibc Pi cell
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/pi-cell-fork-0.84.2-Linux-x86_64-glibc.json

      - name: Attest upstream 0.73.1 Darwin arm64 Pi cell
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/pi-cell-upstream-0.73.1-Darwin-arm64-none.json

      - name: Attest upstream 0.73.1 Darwin x86_64 Pi cell
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/pi-cell-upstream-0.73.1-Darwin-x86_64-none.json

      - name: Attest upstream 0.73.1 Linux x86_64 glibc Pi cell
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/pi-cell-upstream-0.73.1-Linux-x86_64-glibc.json

  stable-core-conformance-linux:
    name: Linux exact-candidate shell, broker, and adapter conformance
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: recursive

      - name: Set up pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.2'

      - name: Harden native Node.js executable
        run: |
          set -euo pipefail
          node_bin="$(python3 -c 'import os, shutil; print(os.path.realpath(shutil.which("node")))')"
          test -f "$node_bin"
          test -x "$node_bin"
          staged_node_root="${RUNNER_TEMP}/mainframe-native-node"
          staged_node_dir="$staged_node_root/bin"
          [[ ! -e "$staged_node_root" && ! -L "$staged_node_root" ]]
          mkdir -m 0700 "$staged_node_root"
          mkdir -m 0700 "$staged_node_dir"
          staged_node_dir="$(cd "$staged_node_dir" && pwd -P)"
          /usr/bin/install -m 0755 "$node_bin" "$staged_node_dir/node"
          cmp -s "$node_bin" "$staged_node_dir/node"
          printf '%s\n' "$staged_node_dir" >> "$GITHUB_PATH"

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.2.20'

      - name: Set up integrity-pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          checksum: aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967
          enable-cache: false

      - name: Install Linux shell dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq zsh
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          getconf GNU_LIBC_VERSION | grep -Eq '^glibc [0-9]'
          test -x /bin/bash
          test -x /bin/zsh

      - name: Install integrity-pinned BATS
        run: |
          git clone --no-checkout --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git tests/bats
          git -C tests/bats checkout --detach "$BATS_CORE_COMMIT"
          test "$(git -C tests/bats rev-parse HEAD)" = "$BATS_CORE_COMMIT"

      - name: Prepare locked Node and MCP clients
        run: |
          set -euo pipefail
          node_lock="$GITHUB_WORKSPACE/bindings/nodejs/bun.lock"
          test -s "$node_lock"
          test ! -L "$node_lock"
          git ls-files --error-unmatch bindings/nodejs/bun.lock
          node_lock_sha_before="$(sha256sum "$node_lock" | awk '{print $1}')"
          (cd bindings/nodejs && bun install --frozen-lockfile --ignore-scripts)
          node_lock_sha_after="$(sha256sum "$node_lock" | awk '{print $1}')"
          test "$node_lock_sha_after" = "$node_lock_sha_before"
          git diff --exit-code -- bindings/nodejs/bun.lock
          # This environment supplies only the pinned SDK dependency for the
          # source conformance harness. The distributable package is installed
          # and exercised separately from the downloaded wheel below.
          (cd mcp && uv sync --locked --no-install-project --group dev)
          test -x "$GITHUB_WORKSPACE/mcp/.venv/bin/python"
          (
            cd "$RUNNER_TEMP"
            "$GITHUB_WORKSPACE/mcp/.venv/bin/python" -c 'from mcp.server import Server'
          )
          printf 'MAINFRAME_CONFORMANCE_BUN=%s\n' "$(command -v bun)" >> "$GITHUB_ENV"
          printf 'MAINFRAME_MCP_PYTHON=%s\n' \
            "$GITHUB_WORKSPACE/mcp/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Install integrity-pinned Pi with lifecycle scripts disabled
        env:
          PI_PACKAGE: '@earendil-works/pi-coding-agent'
          PI_VERSION: '0.84.2'
          PI_INTEGRITY: 'sha512-l4E+B7hgXKWddRo8bC/eSue2aWZjEgJ9xIpf5p0Og+lq8a2TArCwJ0HCoCPCgaBP/tN4zbYH/wOwvx9pJpeLCA=='
        run: |
          set -euo pipefail
          pi_prefix="$RUNNER_TEMP/stable-core-pi-prefix"
          npm_home="$RUNNER_TEMP/stable-core-pi-home"
          npm_cache="$RUNNER_TEMP/stable-core-pi-cache"
          mkdir -p "$pi_prefix" "$npm_home" "$npm_cache"
          actual_integrity="$(
            HOME="$npm_home" \
            npm_config_cache="$npm_cache" \
            npm_config_userconfig=/dev/null \
            npm view "$PI_PACKAGE@$PI_VERSION" dist.integrity
          )"
          test "$actual_integrity" = "$PI_INTEGRITY"
          HOME="$npm_home" \
          npm_config_cache="$npm_cache" \
          npm_config_userconfig=/dev/null \
          npm_config_ignore_scripts=true \
          npm_config_audit=false \
          npm_config_fund=false \
            npm install \
              --prefix "$pi_prefix" \
              --ignore-scripts \
              --no-audit \
              --no-fund \
              --package-lock=false \
              "$PI_PACKAGE@$PI_VERSION"
          pi_bin="$pi_prefix/node_modules/.bin/pi"
          test -x "$pi_bin"
          test "$("$pi_bin" --version)" = "$PI_VERSION"
          printf 'MAINFRAME_PI_BIN=%s\n' "$pi_bin" >> "$GITHUB_ENV"
          printf 'MAINFRAME_PI_NODE_BIN=%s\n' "$(command -v node)" >> "$GITHUB_ENV"

      - name: Assemble and safely extract the exact release candidate
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/mainframe-linux-conformance-evidence"
          release_output="$(mktemp -d "$RUNNER_TEMP/mainframe-linux-release.XXXXXX")"
          candidate_root="$(mktemp -d "$RUNNER_TEMP/mainframe-linux-runtime.XXXXXX")"
          version="$(tr -d '[:space:]' < VERSION)"
          archive="$release_output/mainframe-${version}.tar.gz"
          checksum="${archive}.sha256"
          manifest="$release_output/mainframe-${version}.candidate.json"
          mkdir -p "$evidence/shell"
          source_date_epoch="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH="$source_date_epoch"
          bash --noprofile --norc -p scripts/dev/release-candidate.sh \
            --prepare --output-dir "$release_output"
          bash --noprofile --norc -p scripts/dev/release-candidate.sh \
            --check --output-dir "$release_output"
          (cd "$release_output" && sha256sum -c "$(basename "$checksum")")
          python3 scripts/dev/native-host/safe-extract.py "$archive" "$candidate_root"
          test "$(< "$candidate_root/VERSION")" = "$version"
          test -x "$candidate_root/bin/mainframe"
          test -f "$candidate_root/skills/pi/SKILL.md"
          test -f "$candidate_root/skills/pi/extensions/mainframe.ts"
          jq -e '
            .name == "@gtwatts/mainframe-pi" and
            .pi.extensions == ["./skills/pi/extensions/mainframe.ts"] and
            .pi.skills == ["./skills/pi"]
          ' "$candidate_root/package.json" >/dev/null
          cp "$checksum" "$evidence/mainframe-${version}.tar.gz.sha256"
          cp "$manifest" "$evidence/mainframe-${version}.candidate.json"
          {
            printf 'MAINFRAME_LINUX_ARCHIVE=%s\n' "$archive"
            printf 'MAINFRAME_LINUX_CANDIDATE_ROOT=%s\n' "$candidate_root"
            printf 'MAINFRAME_LINUX_EVIDENCE=%s\n' "$evidence"
            printf 'MAINFRAME_CONFORMANCE_RUNTIME_ROOT=%s\n' "$candidate_root"
          } >> "$GITHUB_ENV"

      - name: Certify exact-archive install and broker in fresh Bash and zsh
        run: |
          set -euo pipefail
          for shell_name in bash zsh; do
            output="$MAINFRAME_LINUX_EVIDENCE/shell/codex-Linux-x86_64-glibc-${shell_name}.json"
            MAINFRAME_BASH="$(command -v bash)" \
              bash --noprofile --norc -p \
              "$MAINFRAME_LINUX_CANDIDATE_ROOT/scripts/dev/certify-shell-onboarding.sh" \
              codex \
              --archive "$MAINFRAME_LINUX_ARCHIVE" \
              --shell "$shell_name" \
              --output "$output"
            python3 \
              "$MAINFRAME_LINUX_CANDIDATE_ROOT/scripts/dev/native-host/validate-evidence.py" \
              "$MAINFRAME_LINUX_CANDIDATE_ROOT/scripts/dev/shell-onboarding-evidence.schema.json" \
              "$output"
            jq -e \
              --arg shell "$shell_name" '
                .certification == "shell-onboarding-certified" and
                .host == "codex" and .shell == $shell and
                .os == "Linux" and .arch == "x86_64" and
                .system_libc == "glibc" and .installed_payload == "exact"
              ' "$output" >/dev/null
          done

      - name: Re-run broker arithmetic-injection regressions against the exact candidate
        run: |
          set -euo pipefail
          state_root="$(mktemp -d "$RUNNER_TEMP/mainframe-linux-broker-state.XXXXXX")"
          evidence="$MAINFRAME_LINUX_EVIDENCE/broker-pocs.txt"
          for bound in min max; do
            marker="$state_root/${bound}-arithmetic-executed"
            # shellcheck disable=SC2016 # Deliberate inert regression payload.
            payload="$(printf 'a[$(printf marker > "%s")]' "$marker")"
            if [[ "$bound" == min ]]; then
              input="$(jq -cn --arg payload "$payload" \
                '{value:"1",min:$payload,max:""}')"
            else
              input="$(jq -cn --arg payload "$payload" \
                '{value:"1",min:"",max:$payload}')"
            fi
            set +e
            envelope="$(
              XDG_STATE_HOME="$state_root/state" \
                "$MAINFRAME_LINUX_CANDIDATE_ROOT/bin/mainframe" invoke \
                mf:std:validation:validate_int \
                --input-json "$input" \
                --format broker-json-v1 \
                --caller linux-security-regression \
                2>"$state_root/${bound}.stderr"
            )"
            probe_status=$?
            set -e
            test "$probe_status" -eq 1
            test ! -e "$marker"
            test ! -s "$state_root/${bound}.stderr"
            jq -e '
              .ok == false and .status == "function_error" and
              .exit_code == 1 and .stdout_b64 == "" and .stderr_b64 == ""
            ' <<<"$envelope" >/dev/null
            printf '%s_arithmetic_payload=denied_without_execution\n' "$bound" >> "$evidence"
          done
          for input in \
            '{"value":"08","min":"000","max":"010"}' \
            '{"value":"-08","min":"-010","max":"-001"}'
          do
            envelope="$(
              XDG_STATE_HOME="$state_root/state" \
                "$MAINFRAME_LINUX_CANDIDATE_ROOT/bin/mainframe" invoke \
                mf:std:validation:validate_int \
                --input-json "$input" --format broker-json-v1
            )"
            jq -e '
              .ok == true and .status == "success" and .exit_code == 0 and
              .stdout_b64 == "" and .stderr_b64 == "" and .error == null
            ' <<<"$envelope" >/dev/null
          done
          printf 'signed_and_leading_zero_ranges=preserved\n' >> "$evidence"

      - name: Run all five adapters against the extracted exact candidate
        env:
          MAINFRAME_REQUIRE_FULL_STABLE_CORE: '1'
          PI_TELEMETRY: '0'
        run: |
          set -euo pipefail
          python3 tests/stable_core_conformance.py \
            --runtime-root "$MAINFRAME_LINUX_CANDIDATE_ROOT" \
            --adapters cli,node,python,mcp,pi \
            --require-adapters cli,node,python,mcp,pi \
            | tee "$MAINFRAME_LINUX_EVIDENCE/stable-core-conformance.log"
          bash tests/bats/bin/bats \
            --formatter tap \
            --print-output-on-failure \
            tests/stable_core_conformance.bats \
            | tee "$MAINFRAME_LINUX_EVIDENCE/stable-core-conformance.tap"
          grep -Fq 'adapter_ok name=pi cases=28 extension=runtime-root loader=installed-pi' \
            "$MAINFRAME_LINUX_EVIDENCE/stable-core-conformance.log"
          grep -Fq 'stable_core_conformance=PASS contracts=26 cases=28 adapters=cli,node,python,mcp,pi skipped=none' \
            "$MAINFRAME_LINUX_EVIDENCE/stable-core-conformance.log"
          version="$(tr -d '[:space:]' < VERSION)"
          (
            cd "$MAINFRAME_LINUX_EVIDENCE"
            sha256sum \
              "mainframe-${version}.tar.gz.sha256" \
              "mainframe-${version}.candidate.json" \
              stable-core-conformance.log \
              stable-core-conformance.tap \
              broker-pocs.txt \
              shell/codex-Linux-x86_64-glibc-bash.json \
              shell/codex-Linux-x86_64-glibc-zsh.json \
              > linux-exact-candidate-conformance.sha256
            test "$(wc -l < linux-exact-candidate-conformance.sha256 | tr -d '[:space:]')" -eq 7
            sha256sum -c linux-exact-candidate-conformance.sha256
          )

      - name: Upload Linux exact-candidate conformance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-exact-candidate-conformance
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/mainframe-linux-conformance-evidence

  archive-cross-platform:
    name: Canonical archive parity (Linux/macOS)
    runs-on: ubuntu-latest
    needs: [test-linux, test-macos]
    steps:
      - name: Download Linux evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-bats-results
          path: evidence/linux

      - name: Download macOS evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-bats-results
          path: evidence/macos

      - name: Require byte-identical release digests
        run: |
          set -euo pipefail
          test -s evidence/linux/release-archive.sha256
          test -s evidence/macos/release-archive.sha256
          cmp evidence/linux/release-archive.sha256 evidence/macos/release-archive.sha256

  shell-onboarding:
    name: Shell onboarding (${{ matrix.host }}, ${{ matrix.target.id }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.target.runner }}
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: macos-15
            id: Darwin-arm64-none
            os: Darwin
            arch: arm64
            system_libc: none
          - runner: macos-15-intel
            id: Darwin-x86_64-none
            os: Darwin
            arch: x86_64
            system_libc: none
          - runner: ubuntu-24.04
            id: Linux-x86_64-glibc
            os: Linux
            arch: x86_64
            system_libc: glibc
        host: [codex, claude-code, copilot, gemini]
        shell: [bash, zsh]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Install runtime dependencies (Linux)
        if: matrix.target.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq zsh

      - name: Install modern Bash and jq (macOS)
        if: matrix.target.os == 'Darwin'
        run: brew install bash jq

      - name: Build exact onboarding candidate
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target.os }}" == "Darwin" ]]; then
            MAINFRAME_BASH="$(brew --prefix bash)/bin/bash"
          else
            MAINFRAME_BASH="$(command -v bash)"
          fi
          export MAINFRAME_BASH
          "$MAINFRAME_BASH" scripts/dev/native-host/assert-runner-platform.sh \
            "${{ matrix.target.id }}" "${{ matrix.target.os }}" \
            "${{ matrix.target.arch }}" "${{ matrix.target.system_libc }}"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          "$MAINFRAME_BASH" scripts/generate-sbom.sh
          "$MAINFRAME_BASH" scripts/build-release-archive.sh

      - name: Certify fresh-shell explicit-consent onboarding
        env:
          EVIDENCE_PATH: shell-onboarding-evidence/${{ matrix.host }}-${{ matrix.target.id }}-${{ matrix.shell }}.json
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target.os }}" == "Darwin" ]]; then
            MAINFRAME_BASH="$(brew --prefix bash)/bin/bash"
          else
            MAINFRAME_BASH="$(command -v bash)"
          fi
          export MAINFRAME_BASH
          version="$(tr -d '[:space:]' < VERSION)"
          archive="$PWD/dist/mainframe-${version}.tar.gz"
          proof_source="$(mktemp -d "${RUNNER_TEMP}/mainframe-shell-onboarding-source.XXXXXX")"
          tar -xzf "$archive" -C "$proof_source"
          test -x "$proof_source/scripts/dev/certify-shell-onboarding.sh"
          test -f "$proof_source/scripts/dev/native-host/validate-evidence.py"
          test -f "$proof_source/scripts/dev/shell-onboarding-evidence.schema.json"
          mkdir -p shell-onboarding-evidence
          "$MAINFRAME_BASH" "$proof_source/scripts/dev/certify-shell-onboarding.sh" \
            "${{ matrix.host }}" \
            --shell "${{ matrix.shell }}" \
            --archive "$archive" \
            --output "$EVIDENCE_PATH"
          python3 "$proof_source/scripts/dev/native-host/validate-evidence.py" \
            "$proof_source/scripts/dev/shell-onboarding-evidence.schema.json" \
            "$EVIDENCE_PATH"
          jq -e \
            --arg host "${{ matrix.host }}" \
            --arg shell "${{ matrix.shell }}" \
            --arg os "${{ matrix.target.os }}" \
            --arg arch "${{ matrix.target.arch }}" \
            --arg system_libc "${{ matrix.target.system_libc }}" '
              .host == $host and
              .shell == $shell and
              .os == $os and
              .arch == $arch and
              .system_libc == $system_libc
            ' "$EVIDENCE_PATH" >/dev/null

      - name: Upload shell-onboarding evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shell-onboarding-${{ matrix.host }}-${{ matrix.target.id }}-${{ matrix.shell }}
          path: shell-onboarding-evidence/${{ matrix.host }}-${{ matrix.target.id }}-${{ matrix.shell }}.json
          if-no-files-found: error
          retention-days: 14

  installed-awm-handoff:
    name: Installed AWM handoff (${{ matrix.target.id }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.target.runner }}
    needs: lint
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: macos-15
            id: Darwin-arm64-none
            os: Darwin
            arch: arm64
            system_libc: none
          - runner: macos-15-intel
            id: Darwin-x86_64-none
            os: Darwin
            arch: x86_64
            system_libc: none
          - runner: ubuntu-24.04
            id: Linux-x86_64-glibc
            os: Linux
            arch: x86_64
            system_libc: glibc
        shell: [bash, zsh]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up release-construction Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Bind release-construction Python
        run: |
          set -euo pipefail
          release_python="$(command -v python3)"
          test "$($release_python -I -S -B -c \
            'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')" = 3.12
          printf 'MAINFRAME_AWM_RELEASE_PYTHON=%s\n' "$release_python" >> "$GITHUB_ENV"

      - name: Set up exact Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'

      - name: Install runtime dependencies (Linux)
        if: matrix.target.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zsh

      - name: Install runtime dependencies (macOS)
        if: matrix.target.os == 'Darwin'
        run: |
          brew install bash jq
          printf '%s\n' "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

      - name: Build and extract the exact release archive
        run: |
          set -euo pipefail
          python_bin="$(command -v python3)"
          test "$("$python_bin" -I -S -B -c \
            'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')" = 3.9
          if [[ "${{ matrix.target.os }}" == Darwin ]]; then
            mainframe_bash="$(brew --prefix bash)/bin/bash"
          else
            mainframe_bash="$(command -v bash)"
          fi
          "$mainframe_bash" scripts/dev/native-host/assert-runner-platform.sh \
            "${{ matrix.target.id }}" "${{ matrix.target.os }}" \
            "${{ matrix.target.arch }}" "${{ matrix.target.system_libc }}"
          release_output="$(mktemp -d \
            "$RUNNER_TEMP/mainframe-installed-awm-release.XXXXXX")"
          proof_source="$(mktemp -d \
            "$RUNNER_TEMP/mainframe-installed-awm-source.XXXXXX")"
          public_root="$(mktemp -d \
            "$RUNNER_TEMP/mainframe-installed-awm-public.XXXXXX")"
          private_root="$(mktemp -d \
            "$RUNNER_TEMP/mainframe-installed-awm-private.XXXXXX")"
          chmod 700 "$release_output" "$proof_source" "$public_root" "$private_root"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          MAINFRAME_BASH="$mainframe_bash" \
            MAINFRAME_PYTHON="$MAINFRAME_AWM_RELEASE_PYTHON" \
            "$mainframe_bash" --noprofile --norc -p \
            scripts/dev/release-candidate.sh --prepare \
            --output-dir "$release_output"
          MAINFRAME_BASH="$mainframe_bash" \
            MAINFRAME_PYTHON="$MAINFRAME_AWM_RELEASE_PYTHON" \
            "$mainframe_bash" --noprofile --norc -p \
            scripts/dev/release-candidate.sh --check \
            --output-dir "$release_output"
          version="$(tr -d '[:space:]' < VERSION)"
          archive="$release_output/mainframe-${version}.tar.gz"
          checksum="${archive}.sha256"
          test -f "$archive" && test ! -L "$archive"
          test -f "$checksum" && test ! -L "$checksum"
          "$python_bin" -I -S -B scripts/dev/native-host/safe-extract.py \
            "$archive" "$proof_source"
          test -x "$proof_source/scripts/dev/certify-installed-awm-handoff.py"
          test -f "$proof_source/evals/agent-impact/installed-awm-handoff-private.schema.json"
          test -f "$proof_source/evals/agent-impact/installed-awm-handoff-evidence.schema.json"
          test -f "$proof_source/docs/INSTALLED_AWM_HANDOFF_CONFORMANCE.md"
          {
            printf 'MAINFRAME_AWM_CANARY_PYTHON=%s\n' "$python_bin"
            printf 'MAINFRAME_AWM_CANARY_ARCHIVE=%s\n' "$archive"
            printf 'MAINFRAME_AWM_CANARY_CHECKSUM=%s\n' "$checksum"
            printf 'MAINFRAME_AWM_CANARY_SOURCE=%s\n' "$proof_source"
            printf 'MAINFRAME_AWM_CANARY_PUBLIC=%s\n' "$public_root"
            printf 'MAINFRAME_AWM_CANARY_PRIVATE=%s\n' "$private_root"
          } >> "$GITHUB_ENV"

      - name: Run and independently verify the installed handoff canary
        env:
          CANARY_SHELL: ${{ matrix.shell }}
          EXPECTED_PLATFORM_ID: ${{ matrix.target.id }}
        run: |
          set -euo pipefail
          certifier="$MAINFRAME_AWM_CANARY_SOURCE/scripts/dev/certify-installed-awm-handoff.py"
          private_evidence="$MAINFRAME_AWM_CANARY_PRIVATE/${EXPECTED_PLATFORM_ID}-${CANARY_SHELL}.json"
          public_evidence="$MAINFRAME_AWM_CANARY_PUBLIC/${EXPECTED_PLATFORM_ID}-${CANARY_SHELL}.json"
          "$MAINFRAME_AWM_CANARY_PYTHON" -I -S -B "$certifier" run \
            --archive "$MAINFRAME_AWM_CANARY_ARCHIVE" \
            --checksum "$MAINFRAME_AWM_CANARY_CHECKSUM" \
            --shell "$CANARY_SHELL" \
            --private-output "$private_evidence" \
            --output "$public_evidence"
          "$MAINFRAME_AWM_CANARY_PYTHON" -I -S -B "$certifier" verify \
            --archive "$MAINFRAME_AWM_CANARY_ARCHIVE" \
            --checksum "$MAINFRAME_AWM_CANARY_CHECKSUM" \
            --shell "$CANARY_SHELL" \
            --private-evidence "$private_evidence" \
            --evidence "$public_evidence"
          "$MAINFRAME_AWM_CANARY_PYTHON" -I -S -B - \
            "$private_evidence" "$public_evidence" <<'PY'
          from pathlib import Path
          import stat
          import sys

          private_path, public_path = map(Path, sys.argv[1:])
          assert private_path.is_file() and not private_path.is_symlink()
          assert public_path.is_file() and not public_path.is_symlink()
          assert stat.S_IMODE(private_path.stat().st_mode) == 0o600
          assert stat.S_IMODE(public_path.stat().st_mode) == 0o644
          PY
          archive_sha="$($MAINFRAME_AWM_CANARY_PYTHON -I -S -B - \
            "$MAINFRAME_AWM_CANARY_ARCHIVE" <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import sys
          print(sha256(Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )"
          jq -e \
            --arg archive_sha "$archive_sha" \
            --arg platform "$EXPECTED_PLATFORM_ID" \
            --arg shell "$CANARY_SHELL" '
              (keys | sort) == [
                "candidate", "claim_scope", "execution", "integrity", "kind",
                "mechanism", "non_claims", "parity", "platform", "protocol",
                "schema_version", "shell", "status"
              ] and
              .schema_version == 1 and
              .kind == "mainframe-installed-awm-handoff-evidence" and
              .claim_scope ==
                "installed-candidate-awm-handoff-mechanism-conformance-only" and
              .status == "passed" and
              .candidate.archive_sha256 == $archive_sha and
              .candidate.installed_payload ==
                "authenticated-release-files-private-staging" and
              .platform.id == $platform and .shell.name == $shell and
              (.shell | keys | sort) == [
                "distinct_processes", "executable_sha256",
                "fresh_login_shell_count", "isolated_profile_discovery",
                "name", "runtime_bash", "version"
              ] and
              (.shell.runtime_bash | keys | sort) == [
                "executable_sha256", "version"
              ] and
              (.shell.runtime_bash.executable_sha256 |
                test("^[0-9a-f]{64}$")) and
              (.shell.runtime_bash.version |
                test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?\\([0-9]+\\)-[A-Za-z0-9._+-]+$")) and
              ($shell != "bash" or (
                .shell.executable_sha256 ==
                  .shell.runtime_bash.executable_sha256 and
                .shell.version == .shell.runtime_bash.version
              )) and
              .shell.fresh_login_shell_count == 4 and
              .shell.distinct_processes == true and
              .shell.isolated_profile_discovery == true and
              .mechanism.mainframe_runtime_exercised == true and
              .mechanism.mainframe_awm_exercised == true and
              .mechanism.source_fact_occurrences_control == 1 and
              .mechanism.source_fact_occurrences_treatment == 1 and
              .mechanism.neutral_envelopes_equal == true and
              .parity.control_score == 100 and .parity.treatment_score == 100 and
              .parity.score_delta == 0 and .parity.outcome == "tie" and
              .parity.final_trees_equal == true and
              .integrity.public_paths_embedded == false and
              .non_claims.same_local_account_isolation == "not-established" and
              .execution == {
                certifier_started_live_agent_sessions: 0,
                certifier_started_provider_sessions: 0,
                certifier_issued_provider_requests: 0,
                certifier_started_pi_sessions: 0,
                certifier_started_ollama_sessions: 0,
                certifier_network_api_calls: 0,
                host_activation_performed: false,
                external_publication_performed: false
              }
            ' "$public_evidence" >/dev/null
          "$MAINFRAME_AWM_CANARY_PYTHON" -I -S -B - \
            "$public_evidence" "$RUNNER_TEMP" "$GITHUB_WORKSPACE" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          evidence = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          forbidden_roots = tuple(sys.argv[2:])

          def visit(value):
              if isinstance(value, dict):
                  lowered = [key.lower() for key in value]
                  assert not any(
                      key in {"path", "paths"}
                      or key.startswith("path_")
                      or key.endswith(("_path", "_paths"))
                      for key in lowered
                  )
                  for child in value.values():
                      visit(child)
              elif isinstance(value, list):
                  for child in value:
                      visit(child)
              elif isinstance(value, str):
                  assert not value.startswith("/")
                  assert re.match(r"^[A-Za-z]:[\\/]", value) is None
                  assert not any(root and root in value for root in forbidden_roots)

          visit(evidence)
          PY

      - name: Upload public installed-handoff evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installed-awm-handoff-${{ matrix.target.id }}-${{ matrix.shell }}
          path: ${{ env.MAINFRAME_AWM_CANARY_PUBLIC }}/${{ matrix.target.id }}-${{ matrix.shell }}.json
          if-no-files-found: error
          retention-days: 14

  installed-awm-handoff-aggregate:
    name: Aggregate installed AWM handoff evidence
    runs-on: ubuntu-24.04
    needs: installed-awm-handoff
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Set up exact Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'

      - name: Download Darwin arm64 Bash evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installed-awm-handoff-Darwin-arm64-none-bash
          path: ${{ runner.temp }}/installed-awm-handoff/evidence

      - name: Download Darwin arm64 zsh evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installed-awm-handoff-Darwin-arm64-none-zsh
          path: ${{ runner.temp }}/installed-awm-handoff/evidence

      - name: Download Darwin x86_64 Bash evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installed-awm-handoff-Darwin-x86_64-none-bash
          path: ${{ runner.temp }}/installed-awm-handoff/evidence

      - name: Download Darwin x86_64 zsh evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installed-awm-handoff-Darwin-x86_64-none-zsh
          path: ${{ runner.temp }}/installed-awm-handoff/evidence

      - name: Download Linux x86_64 Bash evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installed-awm-handoff-Linux-x86_64-glibc-bash
          path: ${{ runner.temp }}/installed-awm-handoff/evidence

      - name: Download Linux x86_64 zsh evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installed-awm-handoff-Linux-x86_64-glibc-zsh
          path: ${{ runner.temp }}/installed-awm-handoff/evidence

      - name: Require the exact six public cells and one archive digest
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/installed-awm-handoff/evidence
          AGGREGATE_PATH: ${{ runner.temp }}/installed-awm-handoff/aggregate.json
        run: |
          set -euo pipefail
          test "$(python3 -I -S -B -c \
            'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')" = 3.9
          python3 -I -S -B - <<'PY'
          from hashlib import sha256
          import json
          import math
          import os
          from pathlib import Path
          import re

          claim = "installed-candidate-awm-handoff-mechanism-conformance-only"
          evidence_root = Path(os.environ["EVIDENCE_ROOT"])
          aggregate_path = Path(os.environ["AGGREGATE_PATH"])
          expected = [
              ("Darwin-arm64-none", "bash"),
              ("Darwin-arm64-none", "zsh"),
              ("Darwin-x86_64-none", "bash"),
              ("Darwin-x86_64-none", "zsh"),
              ("Linux-x86_64-glibc", "bash"),
              ("Linux-x86_64-glibc", "zsh"),
          ]
          expected_names = {f"{platform}-{shell}.json" for platform, shell in expected}
          observed = {path.name for path in evidence_root.iterdir()}
          assert observed == expected_names, (sorted(observed), sorted(expected_names))

          def pairs(values):
              result = {}
              for key, value in values:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(f"non-finite JSON number: {value}")

          def visit(value):
              if isinstance(value, dict):
                  lowered = [key.lower() for key in value]
                  assert not any(
                      key in {"path", "paths"}
                      or key.startswith("path_")
                      or key.endswith(("_path", "_paths"))
                      for key in lowered
                  )
                  for child in value.values():
                      visit(child)
              elif isinstance(value, list):
                  for child in value:
                      visit(child)
              elif isinstance(value, str):
                  assert not value.startswith("/")
                  assert re.match(r"^[A-Za-z]:[\\/]", value) is None
              elif isinstance(value, float):
                  assert math.isfinite(value)

          archive_digests = set()
          cells = []
          exact_keys = {
              "schema_version", "kind", "claim_scope", "status", "candidate",
              "platform", "shell", "protocol", "mechanism", "parity",
              "integrity", "execution", "non_claims",
          }
          exact_execution = {
              "certifier_started_live_agent_sessions": 0,
              "certifier_started_provider_sessions": 0,
              "certifier_issued_provider_requests": 0,
              "certifier_started_pi_sessions": 0,
              "certifier_started_ollama_sessions": 0,
              "certifier_network_api_calls": 0,
              "host_activation_performed": False,
              "external_publication_performed": False,
          }
          for platform, shell in expected:
              path = evidence_root / f"{platform}-{shell}.json"
              assert path.is_file() and not path.is_symlink()
              raw = path.read_bytes()
              assert len(raw) <= 1024 * 1024
              document = json.loads(
                  raw.decode("utf-8", errors="strict"),
                  object_pairs_hook=pairs,
                  parse_constant=reject_constant,
              )
              assert set(document) == exact_keys
              assert document["schema_version"] == 1
              assert document["kind"] == "mainframe-installed-awm-handoff-evidence"
              assert document["claim_scope"] == claim
              assert document["status"] == "passed"
              assert document["candidate"]["installed_payload"] == \
                  "authenticated-release-files-private-staging"
              assert document["platform"]["id"] == platform
              assert document["shell"]["name"] == shell
              shell_record = document["shell"]
              assert set(shell_record) == {
                  "name", "executable_sha256", "version", "runtime_bash",
                  "fresh_login_shell_count", "distinct_processes",
                  "isolated_profile_discovery",
              }
              runtime_bash = shell_record["runtime_bash"]
              assert set(runtime_bash) == {"executable_sha256", "version"}
              assert re.fullmatch(r"[0-9a-f]{64}", runtime_bash["executable_sha256"])
              version_match = re.fullmatch(
                  r"([0-9]+)\.([0-9]+)(?:\.[0-9]+)?\([0-9]+\)-[A-Za-z0-9._+-]+",
                  runtime_bash["version"],
              )
              assert version_match is not None
              assert tuple(map(int, version_match.groups())) >= (4, 4)
              if shell == "bash":
                  assert shell_record["executable_sha256"] == \
                      runtime_bash["executable_sha256"]
                  assert shell_record["version"] == runtime_bash["version"]
              assert document["execution"] == exact_execution
              assert document["non_claims"]["same_local_account_isolation"] == \
                  "not-established"
              assert document["integrity"]["public_paths_embedded"] is False
              archive_sha = document["candidate"]["archive_sha256"]
              assert re.fullmatch(r"[0-9a-f]{64}", archive_sha)
              archive_digests.add(archive_sha)
              visit(document)
              cells.append({
                  "platform_id": platform,
                  "shell": shell,
                  "evidence_sha256": sha256(raw).hexdigest(),
              })
          assert len(archive_digests) == 1, sorted(archive_digests)
          aggregate = {
              "schema_version": 1,
              "kind": "mainframe-installed-awm-handoff-matrix-aggregate",
              "claim_scope": claim,
              "status": "passed",
              "archive_sha256": next(iter(archive_digests)),
              "cell_count": 6,
              "cells": cells,
          }
          aggregate_path.parent.mkdir(mode=0o755, parents=True, exist_ok=True)
          payload = json.dumps(
              aggregate, sort_keys=True, separators=(",", ":"),
              ensure_ascii=True, allow_nan=False,
          ).encode("ascii") + b"\n"
          descriptor = os.open(
              aggregate_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o644
          )
          with os.fdopen(descriptor, "wb") as output:
              output.write(payload)
          PY

      - name: Upload public installed-handoff aggregate only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installed-awm-handoff-aggregate
          path: |
            ${{ runner.temp }}/installed-awm-handoff/aggregate.json
            ${{ runner.temp }}/installed-awm-handoff/evidence/*.json
          if-no-files-found: error
          retention-days: 14

  test-bindings:
    name: Bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.2.20'

      - name: Install modern Bash (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install bash
          echo "MAINFRAME_BASH=$(brew --prefix bash)/bin/bash" >> "$GITHUB_ENV"

      - name: Install Python test dependencies
        run: python -m pip install pytest build

      - name: Install managed launcher fixture
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          ln -s "$GITHUB_WORKSPACE/bin/mainframe" "$HOME/.local/bin/mainframe"
          test -x "$HOME/.local/bin/mainframe"

      - name: Test and build Node.js bindings
        working-directory: bindings/nodejs
        run: |
          bun install
          bun run test
          bun run build

      - name: Test and build Python bindings
        env:
          MAINFRAME_ROOT: ${{ github.workspace }}
        run: |
          python -m pytest -q bindings/python/tests
          python -m build bindings/python

  native-host-gemini:
    name: Native Gemini execution (${{ matrix.target.id }})
    runs-on: ${{ matrix.target.runner }}
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_PLATFORM_ID: ${{ matrix.target.id }}
      EXPECTED_OS: ${{ matrix.target.os }}
      EXPECTED_ARCH: ${{ matrix.target.arch }}
      EXPECTED_SYSTEM_LIBC: ${{ matrix.target.system_libc }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: macos-15
            id: Darwin-arm64-none
            os: Darwin
            arch: arm64
            system_libc: none
          - runner: macos-15-intel
            id: Darwin-x86_64-none
            os: Darwin
            arch: x86_64
            system_libc: none
          - runner: ubuntu-24.04
            id: Linux-x86_64-glibc
            os: Linux
            arch: x86_64
            system_libc: glibc
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Set up pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: scripts/dev/native-host/package-lock.json

      - name: Harden native Node.js executable
        run: |
          set -euo pipefail
          node_bin="$(python3 -c 'import os, shutil; print(os.path.realpath(shutil.which("node")))')"
          test -f "$node_bin"
          test -x "$node_bin"
          staged_node_root="${RUNNER_TEMP}/mainframe-native-node"
          staged_node_dir="$staged_node_root/bin"
          [[ ! -e "$staged_node_root" && ! -L "$staged_node_root" ]]
          mkdir -m 0700 "$staged_node_root"
          mkdir -m 0700 "$staged_node_dir"
          staged_node_dir="$(cd "$staged_node_dir" && pwd -P)"
          /usr/bin/install -m 0755 "$node_bin" "$staged_node_dir/node"
          cmp -s "$node_bin" "$staged_node_dir/node"
          printf '%s\n' "$staged_node_dir" >> "$GITHUB_PATH"

      - name: Install runtime dependencies (Linux)
        if: matrix.target.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install runtime dependencies (macOS)
        if: matrix.target.os == 'Darwin'
        run: brew install bash jq

      - name: Install integrity-pinned Gemini CLI
        run: >-
          npm ci
          --prefix scripts/dev/native-host
          --ignore-scripts
          --no-audit
          --no-fund

      - name: Certify native hook execution
        env:
          EVIDENCE_PATH: native-host-evidence/gemini-${{ matrix.target.id }}.json
        run: |
          set -euo pipefail
          MAINFRAME_BASH="$(command -v bash)"
          if [[ "${{ matrix.target.os }}" == "Darwin" ]]; then
            MAINFRAME_BASH="$(brew --prefix bash)/bin/bash"
          fi
          export MAINFRAME_BASH
          "$MAINFRAME_BASH" scripts/dev/native-host/assert-runner-platform.sh \
            "$EXPECTED_PLATFORM_ID" "$EXPECTED_OS" "$EXPECTED_ARCH" \
            "$EXPECTED_SYSTEM_LIBC"
          "$MAINFRAME_BASH" scripts/dev/certify-native-host.sh gemini \
            --prepare-release-metadata \
            --output "$EVIDENCE_PATH"
          python3 scripts/dev/native-host/validate-evidence.py \
            scripts/dev/native-host/evidence.schema.json \
            "$EVIDENCE_PATH"
          jq -e '
            .certification == "execution-certified" and
            .host == "gemini" and
            .host_version == "0.53.1" and
            .host_package_integrity == "sha512-xBGdD/tl05gsTpD2oV1Bq0NCb4BBeTnjSbKxHtwOB7nt1QMaqWYJ9WsOEsQQhQ2P1v0UJth1F17SAXvdZ5mASw==" and
            .host_package_tree_sha256 == "78af76cfb06c42eed086f7de65b67ef1fe45b09106c8dfd14070c35ab1a67e14" and
            .archive_origin == "workspace-build" and
            .source_git_commit == env.GITHUB_SHA and
            .source_git_dirty == false and
            .os == env.EXPECTED_OS and
            .arch == env.EXPECTED_ARCH and
            .system_libc == env.EXPECTED_SYSTEM_LIBC and
            .host_executable_sha256 == "a193db41b0b2c9e35a8c5aafcb2c810947ee41a311757bb4ee4d6b015bc3bfb5" and
            (.archive_sha256 | test("^[0-9a-f]{64}$")) and
            (.hook_config_sha256 | test("^[0-9a-f]{64}$")) and
            .credential_mode == "gemini-fake-responses-no-external-credentials" and
            .control_executions == 1 and
            .protected_executions == 0 and
