                .host_release_manifest_sha256 == $host.signed_release_manifest.sha256 and
                .host_release_manifest_signature_sha256 == $host.signed_release_manifest.signature_sha256 and
                .host_release_signing_key_fingerprint == $host.signed_release_manifest.signing_key_fingerprint and
                .host_release_commit == $host.signed_release_manifest.commit and
                .host_release_build_date == $host.signed_release_manifest.build_date and
                .runtime_launch_mode == "npm-ignore-scripts-direct-platform-binary" and
                .host_cli_wrapper_executed == false and
                .fixture_sha256 == $fixture_sha and
                .fixture_server_sha256 == $server_sha and
                .credential_mode == "claude-loopback-messages-synthetic-bearer-no-user-credentials" and
                .provider_wire_api == "anthropic-messages" and
                .provider_requests_per_run == 2 and
                .provider_requests_total == 4 and
                .provider_placeholder_authorization == true and
                .provider_user_credentials_supplied == false and
                .network_boundary == "loopback-base-url-and-nonessential-traffic-disabled" and
                .project_trust_mode == "claude-print-mode-trust-verification-disabled" and
                .managed_settings_present == false and
                .settings_sources == "project-only" and
                .permission_mode == "dontAsk" and
                .tool_surface == "Bash-only-exact-command-allow" and
                .control_executions == 1 and
                .protected_executions == 0 and
                .control_tool_success == true and
                .protected_tool_denied == true and
                .protected_hook_started == 1 and
                .protected_hook_responses == 1 and
                .protected_hook_exit_code == 2 and
                .protected_denial == "MAINFRAME agent gateway blocked the tool call: risk=high rule=terraform-destroy" and
                .certification == "execution-certified"
              ' "$evidence" >/dev/null
          done

          expected_hosts="$(jq -c '.' scripts/dev/native-host/hosts.json)"
          gemini_awm_fixture_sha="$(sha256sum \
            scripts/dev/native-host/fixtures/gemini-awm-chain.responses.jsonl | awk '{print $1}')"
          codex_awm_fixture_sha="$(sha256sum \
            scripts/dev/native-host/fixtures/codex-awm-chain.responses.json | awk '{print $1}')"
          copilot_awm_fixture_sha="$(sha256sum \
            scripts/dev/native-host/fixtures/copilot-awm-chain.chat-completions.json | awk '{print $1}')"
          claude_awm_fixture_sha="$(sha256sum \
            scripts/dev/native-host/fixtures/claude-awm-chain.messages.json | awk '{print $1}')"
          for evidence in "${awm_chain_evidence[@]}"; do
            python3 scripts/dev/native-host/validate-evidence.py \
              scripts/dev/native-host/awm-chain-evidence.schema.json "$evidence"
            codex_key="$(jq -r '.platform.os + "-" + .platform.arch' "$evidence")"
            native_key="$(jq -r \
              '.platform.os + "-" + .platform.arch + "-" + .platform.libc' \
              "$evidence")"
            expected_codex_platform="$(jq -cer --arg key "$codex_key" \
              '.codex.platforms[$key]' scripts/dev/native-host/hosts.json)"
            expected_copilot_platform="$(jq -cer --arg key "$native_key" \
              '.copilot.platforms[$key]' scripts/dev/native-host/hosts.json)"
            expected_claude_platform="$(jq -cer --arg key "$native_key" \
              '.claude.platforms[$key]' scripts/dev/native-host/hosts.json)"
            jq -e \
              --arg archive_sha "$archive_sha" \
              --arg version "$RELEASE_VERSION" \
              --arg gf "$gemini_awm_fixture_sha" \
              --arg cf "$codex_awm_fixture_sha" \
              --arg pf "$copilot_awm_fixture_sha" \
              --arg af "$claude_awm_fixture_sha" \
              --argjson manifest "$expected_hosts" \
              --argjson codex_platform "$expected_codex_platform" \
              --argjson copilot_platform "$expected_copilot_platform" \
              --argjson claude_platform "$expected_claude_platform" '
                (.negative_probe.provider_command_sha256) as $command_sha |
                .certification == "native-awm-chain-execution-certified" and
                .mainframe.version == $version and
                .mainframe.archive_sha256 == $archive_sha and
                .mainframe.archive_origin == "external-input" and
                .mainframe.installation_count == 1 and
                .mainframe.installed_runtime_read_only == true and
                (.platform.system_libc == "none" or
                  .platform.system_libc == "glibc") and
                .platform.libc == .platform.system_libc and
                .execution_boundaries == {
                  shared_project: true, shared_awm_root: true,
                  shared_awm_session: true, same_uid: true, shared_tmpdir: true,
                  separate_home: true, separate_xdg_config: true,
                  separate_xdg_state: true, separate_xdg_cache: true,
                  fresh_separate_host_state: true, os_process_isolation: false,
                  container_isolation: false,
                  isolation_scope: "fresh-filesystem-host-state-not-os-sandbox"
                } and
                .awm.backend == "file" and .awm.schema_version == 2 and
                .awm.root_mode == "700" and
                .awm.private_artifact_mode == "600" and
                .awm.private_modes_verified == true and
                .awm.checkpoint_count == 5 and .awm.chain_length == 4 and
                .awm.final_key == "chain.claude" and
                (.awm.context_proof as $p |
                  $p.actual_bytes > 0 and $p.actual_bytes <= $p.max_bytes and
                  $p.actual_tokens ==
                    ((($p.actual_bytes + $p.bytes_per_token - 1) /
                      $p.bytes_per_token) | floor) and
                  $p.provenance_session_verified == true and
                  $p.final_value_included == true) and
                (.awm.handoff_proof as $p |
                  $p.actual_bytes > 0 and $p.actual_bytes <= $p.max_bytes and
                  $p.actual_tokens ==
                    ((($p.actual_bytes + $p.bytes_per_token - 1) /
                      $p.bytes_per_token) | floor) and
                  $p.nested_context_actual_bytes > 0 and
                  $p.nested_context_actual_tokens ==
                    ((($p.nested_context_actual_bytes + $p.bytes_per_token - 1) /
                      $p.bytes_per_token) | floor) and
                  $p.provenance_session_verified == true and
                  $p.nested_context_verified == true and
                  $p.final_value_included == true and
                  $p.persisted_byte_equal == true) and
                .hosts.gemini.version == $manifest.gemini.version and
                .hosts.gemini.package_integrity == $manifest.gemini.integrity and
                .hosts.gemini.runtime_tree_sha256 == $manifest.gemini.package_tree_sha256 and
                .hosts.gemini.executable_sha256 == $manifest.gemini.entrypoint_sha256 and
                .hosts.gemini.fixture_sha256 == $gf and
                .hosts.codex.version == $manifest.codex.version and
                .hosts.codex.package_integrity == $manifest.codex.integrity and
                .hosts.codex.platform_package == $codex_platform.package_alias and
                .hosts.codex.platform_package_integrity == $codex_platform.integrity and
                .hosts.codex.runtime_tree_sha256 == $codex_platform.package_tree_sha256 and
                .hosts.codex.executable_sha256 == $codex_platform.executable_sha256 and
                .hosts.codex.fixture_sha256 == $cf and
                .hosts.copilot.version == $manifest.copilot.version and
                .hosts.copilot.package_integrity == $manifest.copilot.integrity and
                .hosts.copilot.platform_package == $copilot_platform.package and
                .hosts.copilot.platform_package_integrity == $copilot_platform.integrity and
                .hosts.copilot.runtime_tree_sha256 == $copilot_platform.runtime_tree_sha256 and
                .hosts.copilot.executable_sha256 == $copilot_platform.executable_sha256 and
                .hosts.copilot.fixture_sha256 == $pf and
                .hosts.claude.version == $manifest.claude.version and
                .hosts.claude.package_integrity == $manifest.claude.integrity and
                .hosts.claude.platform_package == $claude_platform.package and
                .hosts.claude.platform_package_integrity == $claude_platform.integrity and
                .hosts.claude.runtime_tree_sha256 == $claude_platform.runtime_tree_sha256 and
                .hosts.claude.executable_sha256 == $claude_platform.executable_sha256 and
                .hosts.claude.fixture_sha256 == $af and
                ([.hosts[] | select(
                  .version_command_verified == true and
                  .fresh_separate_host_state == true and
                  .provider_command_sha256 == $command_sha and
                  .provider_requests == 2 and
                  .tool_calls == 1 and .gateway_risk == "low" and
                  .gateway_rule == "none" and .gateway_decision == "allow" and
                  .gateway_records == 1 and .audit_mode == "600" and
                  .gateway_observation_scope ==
                    "host-event-tool-policy-tuple-only" and
                  .gateway_command_correlation_available == false and
                  .success_marker_seen == true)] | length) == 4 and
                .hosts.gemini.provider_request_hygiene_checks == 0 and
                ([.hosts.codex, .hosts.copilot, .hosts.claude] |
                  all(.provider_request_hygiene_checks == 2 and
                      .provider_request_guard_mode ==
                        "reject-awm-values-and-root-no-request-persistence")) and
                .evidence_hygiene.raw_seed_embedded == false and
                .evidence_hygiene.checkpoint_values_embedded == false and
                .evidence_hygiene.credentials_embedded == false and
                .evidence_hygiene.absolute_home_paths_embedded == false and
                .evidence_hygiene.provider_requests_embedded == false and
                .evidence_hygiene.private_run_artifacts_embedded == false and
                .evidence_hygiene.loopback_requests_persisted == false and
                .evidence_hygiene.loopback_private_values_observed == false and
                .evidence_hygiene.loopback_awm_root_observed == false and
                .evidence_hygiene.loopback_disposable_paths_may_be_observed == true and
                .negative_probe.executed == true and
                .negative_probe.positive_certificate_binding == true and
                .negative_probe.run_order ==
                  "after-gemini-before-positive-codex" and
                .negative_probe.provider_requests == 2 and
                .negative_probe.provider_status ==
                  "expected-missing-predecessor" and
                .negative_probe.missing_predecessor_marker_seen == true and
                .negative_probe.tool_exit_code == 42 and
                .negative_probe.tool_result_nonzero == true and
                .negative_probe.checkpoint_written == false and
                .negative_probe.scratch_empty == true and
                .negative_probe.later_hosts_started_before_rejection == false and
                .negative_probe.gateway_command_correlation_available == false
              ' "$evidence" >/dev/null
          done

          mapfile -t tested_formulae < <(
            find gate-evidence/homebrew -type f -name mainframe.rb | sort
          )
          mapfile -t tested_checksums < <(
            find gate-evidence/homebrew -type f \
              -name 'mainframe-*.tar.gz.sha256' | sort
          )
          test "${#tested_formulae[@]}" -eq 2
          test "${#tested_checksums[@]}" -eq 2
          for formula in "${tested_formulae[@]}"; do
            cmp dist/mainframe.rb "$formula"
          done
          for tested_checksum in "${tested_checksums[@]}"; do
            cmp "$checksum" "$tested_checksum"
          done

          release_evidence_common=(
            --repo-root "$GITHUB_WORKSPACE"
            --repository "$GITHUB_REPOSITORY"
            --version "$RELEASE_VERSION"
            --tag "$GITHUB_REF_NAME"
            --tag-ref "$GITHUB_REF"
            --tag-ref-sha "$TAG_REF_SHA"
            --tag-commit-sha "$TAG_COMMIT"
            --workflow-run-id "$GITHUB_RUN_ID"
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
            --source-date-epoch "$SOURCE_DATE_EPOCH"
            --archive "$archive"
            --manifest "dist/mainframe-${RELEASE_VERSION}.release-evidence.json"
            --bundle "dist/mainframe-${RELEASE_VERSION}.release-evidence.tar.gz"
          )
          release_evidence_inputs=()
          for evidence in "${all_native_evidence[@]}"; do
            release_evidence_inputs+=(--safety-evidence "$evidence")
          done
          for evidence in "${awm_chain_evidence[@]}"; do
            release_evidence_inputs+=(--awm-evidence "$evidence")
          done
          create_result="$(python3 scripts/dev/native-host/build-release-evidence.py \
            create "${release_evidence_common[@]}" "${release_evidence_inputs[@]}")"
          verify_result="$(python3 scripts/dev/native-host/build-release-evidence.py \
            verify "${release_evidence_common[@]}")"
          test "$(jq -er '.status' <<<"$create_result")" = "created"
          test "$(jq -er '.status' <<<"$verify_result")" = "valid"
          manifest_sha="$(jq -er '.manifest_sha256' <<<"$create_result")"
          bundle_sha="$(jq -er '.bundle_sha256' <<<"$create_result")"
          test "$(jq -er '.manifest_sha256' <<<"$verify_result")" = "$manifest_sha"
          test "$(jq -er '.bundle_sha256' <<<"$verify_result")" = "$bundle_sha"
          manifest="dist/mainframe-${RELEASE_VERSION}.release-evidence.json"
          expected_certifier_input_count="$(jq -er '.files | length' \
            scripts/dev/native-host/certifier-inputs.json)"
          test "$(jq -er '.certifier_input_bundle.files | length' "$manifest")" -eq \
            "$expected_certifier_input_count"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$archive_sha"
          printf 'archive_sha256=%s\n' "$archive_sha" >> "$GITHUB_OUTPUT"
          printf 'checksum_sha256=%s\n' \
            "$(sha256sum "$checksum" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'sbom_sha256=%s\n' \
            "$(sha256sum "dist/mainframe-${RELEASE_VERSION}.sbom.json" | awk '{print $1}')" \
            >> "$GITHUB_OUTPUT"
          printf 'formula_sha256=%s\n' \
            "$(sha256sum dist/mainframe.rb | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'manifest_sha256=%s\n' "$manifest_sha" >> "$GITHUB_OUTPUT"
          printf 'bundle_sha256=%s\n' "$bundle_sha" >> "$GITHUB_OUTPUT"
          printf 'pi_evidence_sha256=%s\n' \
            "$(sha256sum "$pi_evidence" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/mainframe-${{ steps.version.outputs.version }}.tar.gz

      - name: Attest release SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/mainframe-${{ steps.version.outputs.version }}.tar.gz
          sbom-path: dist/mainframe-${{ steps.version.outputs.version }}.sbom.json

      - name: Attest Homebrew formula candidate
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/mainframe.rb

      - name: Attest release evidence predicate
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/mainframe-${{ steps.version.outputs.version }}.tar.gz
            dist/mainframe-${{ steps.version.outputs.version }}.release-evidence.json
            dist/mainframe-${{ steps.version.outputs.version }}.release-evidence.tar.gz
            dist/mainframe-${{ steps.version.outputs.version }}.pi-evidence.json
          predicate-type: https://github.com/gtwatts/mainframe/attestations/release-evidence/v1
          predicate-path: dist/mainframe-${{ steps.version.outputs.version }}.release-evidence.json

      - name: Verify published provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "dist/mainframe-${{ steps.version.outputs.version }}.tar.gz" \
            --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/mainframe.rb --repo "$GITHUB_REPOSITORY"

          predicate_type="https://github.com/gtwatts/mainframe/attestations/release-evidence/v1"
          archive="dist/mainframe-${{ steps.version.outputs.version }}.tar.gz"
          manifest="dist/mainframe-${{ steps.version.outputs.version }}.release-evidence.json"
          bundle="dist/mainframe-${{ steps.version.outputs.version }}.release-evidence.tar.gz"
          pi_evidence="dist/mainframe-${{ steps.version.outputs.version }}.pi-evidence.json"
          evidence_run_id="$(jq -er '.release.workflow.run_id' "$manifest")"
          evidence_run_attempt="$(jq -er '.release.workflow.run_attempt' "$manifest")"
          test "$evidence_run_id" = "$GITHUB_RUN_ID"
          test "$evidence_run_attempt" = "$GITHUB_RUN_ATTEMPT"
          expected_release_invocation="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${evidence_run_id}/attempts/${evidence_run_attempt}"
          expected_subjects="$(jq -cn \
            --arg archive_name "${archive##*/}" \
            --arg archive_sha "$(sha256sum "$archive" | awk '{print $1}')" \
            --arg manifest_name "${manifest##*/}" \
            --arg manifest_sha "$(sha256sum "$manifest" | awk '{print $1}')" \
            --arg bundle_name "${bundle##*/}" \
            --arg bundle_sha "$(sha256sum "$bundle" | awk '{print $1}')" \
            --arg pi_evidence_name "${pi_evidence##*/}" \
            --arg pi_evidence_sha "$(sha256sum "$pi_evidence" | awk '{print $1}')" '
              [
                {name: $archive_name, digest: {sha256: $archive_sha}},
                {name: $manifest_name, digest: {sha256: $manifest_sha}},
                {name: $bundle_name, digest: {sha256: $bundle_sha}},
                {name: $pi_evidence_name, digest: {sha256: $pi_evidence_sha}}
              ] | sort_by(.name)
            ')"
          for subject in \
            "$archive" \
            "$manifest" \
            "$bundle" \
            "$pi_evidence"; do
            verification="$(gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type "$predicate_type" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/test.yml" \
              --signer-digest "${{ steps.version.outputs.tag_commit }}" \
              --source-digest "${{ steps.version.outputs.tag_commit }}" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --limit 100 \
              --format json)"
            jq -e \
              --arg predicate_type "$predicate_type" \
              --arg expected_invocation "$expected_release_invocation" \
              --arg expected_run_id "$evidence_run_id" \
              --argjson expected_run_attempt "$evidence_run_attempt" \
              --argjson expected_subjects "$expected_subjects" \
              --slurpfile manifest "$manifest" '
              any(.[];
                .verificationResult.statement.predicateType == $predicate_type and
                .verificationResult.statement.predicate == $manifest[0] and
                .verificationResult.statement.predicate.release.workflow.run_id ==
                  $expected_run_id and
                .verificationResult.statement.predicate.release.workflow.run_attempt ==
                  $expected_run_attempt and
                (.verificationResult.statement.subject | sort_by(.name)) ==
                  $expected_subjects and
                .verificationResult.signature.certificate.runInvocationURI ==
                  $expected_invocation and
                .verificationResult.signature.certificate.runnerEnvironment ==
                  "github-hosted")
            ' <<<"$verification" >/dev/null
          done

      - name: Transfer release assets to publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mainframe-release-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/mainframe-${{ steps.version.outputs.version }}.tar.gz
            dist/mainframe-${{ steps.version.outputs.version }}.tar.gz.sha256
            dist/mainframe-${{ steps.version.outputs.version }}.sbom.json
            dist/mainframe-${{ steps.version.outputs.version }}.release-evidence.json
            dist/mainframe-${{ steps.version.outputs.version }}.release-evidence.tar.gz
            dist/mainframe-${{ steps.version.outputs.version }}.pi-evidence.json
            dist/mainframe_mcp-${{ steps.version.outputs.version }}-py3-none-any.whl
            dist/mainframe_mcp-${{ steps.version.outputs.version }}.tar.gz
            dist/mainframe-mcp-candidate.sha256
            dist/pi-cell-fork-0.84.2-Darwin-arm64-none.json
            dist/pi-cell-fork-0.84.2-Darwin-x86_64-none.json
            dist/pi-cell-fork-0.84.2-Linux-x86_64-glibc.json
            dist/pi-cell-upstream-0.73.1-Darwin-arm64-none.json
            dist/pi-cell-upstream-0.73.1-Darwin-x86_64-none.json
            dist/pi-cell-upstream-0.73.1-Linux-x86_64-glibc.json
            dist/mainframe.rb

  release-publish:
    name: Publish draft release
    runs-on: ubuntu-latest
    needs: release-build
    environment: mainframe-release
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Checkout certified release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ needs.release-build.outputs.tag_commit }}

      - name: Require protected release environment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          protected=$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GH_REPO/environments/mainframe-release" \
            --jq 'any(.protection_rules[]?;
              .type == "required_reviewers" and .prevent_self_review == true)')
          if [[ "$protected" != "true" ]]; then
            echo "ERROR: mainframe-release must require a reviewer and prevent self-review" >&2
            exit 1
          fi

      - name: Require immutable release-tag rules
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t ruleset_ids < <(
            gh api --paginate \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GH_REPO/rulesets?targets=tag&includes_parents=true&per_page=100" \
              --jq '.[] | select(.name == "mainframe-release-tags") | .id'
          )
          if [[ "${#ruleset_ids[@]}" -ne 1 ]]; then
            echo "ERROR: exactly one mainframe-release-tags ruleset is required" >&2
            exit 1
          fi
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GH_REPO/rulesets/${ruleset_ids[0]}" | jq -e '
              .target == "tag" and
              .enforcement == "active" and
              .conditions.ref_name.include == ["refs/tags/v*"] and
              .conditions.ref_name.exclude == [] and
              ([.rules[].type] | index("update") != null) and
              ([.rules[].type] | index("deletion") != null)
            ' >/dev/null || {
              echo "ERROR: release tags must block update/deletion for refs/tags/v*" >&2
              exit 1
            }

      - name: Revalidate remote release tag identity
        env:
          RELEASE_VERSION: ${{ needs.release-build.outputs.version }}
          EXPECTED_TAG_REF_SHA: ${{ needs.release-build.outputs.tag_ref_sha }}
          EXPECTED_TAG_COMMIT: ${{ needs.release-build.outputs.tag_commit }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/v$RELEASE_VERSION"
          remote_ref_sha="$(git ls-remote --refs origin "$tag_ref" | awk 'NF == 2 {print $1}')"
          if [[ "$remote_ref_sha" != "$EXPECTED_TAG_REF_SHA" ]]; then
            echo "ERROR: remote release tag ref changed after artifact certification" >&2
            exit 1
          fi
          git fetch --force --no-tags origin \
            "$tag_ref:refs/mainframe-publish/release-tag"
          remote_commit="$(git rev-parse 'refs/mainframe-publish/release-tag^{commit}')"
          if [[ "$remote_commit" != "$EXPECTED_TAG_COMMIT" ||
                "$(git rev-parse HEAD)" != "$EXPECTED_TAG_COMMIT" ]]; then
            echo "ERROR: remote release tag commit does not match certified checkout" >&2
            exit 1
          fi
          git fetch --force origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" refs/remotes/origin/main

      - name: Require repository release immutability
        env:
          # Store a fine-grained Administration:read-only token as an
          # environment secret. The workflow GITHUB_TOKEN cannot read this
          # repository policy endpoint and is never replaced for publishing.
          GH_TOKEN: ${{ secrets.MAINFRAME_RELEASE_POLICY_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "ERROR: MAINFRAME_RELEASE_POLICY_TOKEN is required for policy preflight" >&2
            exit 1
          fi
          enabled=$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GH_REPO/immutable-releases" \
            --jq '.enabled')
          if [[ "$enabled" != "true" ]]; then
            echo "ERROR: immutable releases must be enabled before publishing" >&2
            exit 1
          fi

