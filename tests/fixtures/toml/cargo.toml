[package]
name = "my-rust-app"
version = "0.1.0"
edition = "2021"
authors = ["Alice <alice@example.com>", "Bob <bob@example.com>"]
description = "A sample Rust application"
license = "MIT"
keywords = ["cli", "async", "web"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = "0.11"
clap = { version = "4.0", features = ["derive", "env"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"

[profile.release]
opt-level = 3
lto = true

[[bin]]
name = "myapp"
path = "src/main.rs"

[[bin]]
name = "myutil"
path = "src/util.rs"

[workspace]
members = ["crates/core", "crates/cli"]
